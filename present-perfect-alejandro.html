  function grade(){
    clearInterval(timer);
    const norm = s => fold(s).replace(/[^a-z0-9ñ\s]/g,"").replace(/\s+/g," ").trim();
    let ok = 0; const secOk = { mc:0, tf:0, co:0, re:0 };
    exam.querySelectorAll(".exq").forEach(q => {
      const t = q.dataset.t, i = Number(q.dataset.i), fb = q.querySelector(".exfb"); let good = false, sol = "", why = "";
      if(t === "mc"){ const v = q.querySelector("input:checked"); const m = mc[i]; const ck = m.o.findIndex(o => o.ok); good = v && Number(v.value) === ck; sol = `${letters[ck]}) ${m.o[ck].t}`; why = m.x;
        q.querySelectorAll(".exopt").forEach((l,k) => { if(k === ck) l.classList.add("okopt"); else if(v && Number(v.value) === k) l.classList.add("badopt"); }); }
      if(t === "tf"){ const v = q.querySelector("input:checked"); good = v && (v.value === "1") === tf[i].v; sol = tf[i].v ? "Verdadero" : "Falso"; why = tf[i].x;
        q.querySelectorAll(".exopt").forEach(l => { const val = l.querySelector("input").value === "1"; if(val === tf[i].v) l.classList.add("okopt"); else if(l.querySelector("input").checked) l.classList.add("badopt"); }); }
      if(t === "co"){ const v = q.querySelector(".exin").value; good = v.trim() && String(comp[i].respuesta).split("|").map(norm).includes(norm(v)); sol = String(comp[i].respuesta).split("|")[0]; why = comp[i].why || ""; q.querySelector(".exin").classList.add(good ? "okin" : "badin"); }
      if(t === "re"){ const v = q.querySelector(".exsel").value; good = v === rel[i].c; sol = TIPOS[rel[i].c]; q.querySelector(".exsel").classList.add(good ? "okin" : "badin"); }
      if(good){ ok++; secOk[t]++; }
      q.classList.add(good ? "right" : "wrong");
      fb.innerHTML = good ? `✅ ¡Correcto!${why ? " " + esc(why) : ""}` : `❌ Respuesta correcta: <b>${esc(sol)}</b>${why ? ". " + esc(why) : ""}`;
      q.querySelectorAll("input,select").forEach(x => x.disabled = true);

    const nota = nota100(ok, total);
    const des = nivel100(nota);
    const msg = { sup:`¡Excelente, ${kid().name}! Dominas el tema. Estás listo para la evaluación de Language Arts.`, alt:`¡Muy bien, ${kid().name}! Repasa las preguntas que fallaste y quedarás perfecto.`, bas:`¡Vas bien! Repasen juntos las secciones con más errores y vuelve a presentarlo.`, baj:`Vamos a repasar otra vez la pestaña Aprender y los juegos. ¡Después lo vuelves a intentar!` }[des[2]];
    record(KEY, fieldOf("exam100"), nota);
    const secName = { mc:["Selección múltiple", mc.length], tf:["Verdadero o falso", tf.length], co:["Completa", comp.length], re:["Relaciona", rel.length] };
    box.querySelector(".exend").innerHTML = "";
    document.getElementById("exRes").innerHTML = `<div class="exres ${des[2]}">
      <div class="stamp">${des[1]}<b>${nota}</b><small>de 100</small></div>
      <h3>Desempeño ${des[0]}</h3><p>${ok} de ${total} respuestas correctas · Tiempo: ${fmt(secs)}</p>
      <div class="exsecs">${Object.entries(secName).map(([k,[n,t]]) => `<div><span>${n}</span><b>${secOk[k]} / ${t}</b></div>`).join("")}</div>
      <p class="exmsg">${esc(msg)}</p>

    if(nota >= 80){ try{ SFX.win(); confetti(document.getElementById("exRes").querySelector(".exres")); }catch(e){} }
    document.getElementById("exRes").scrollIntoView({ behavior:"smooth", block:"start" });
    document.getElementById("exAgain").onclick = () => { examFinal(box, onBack); window.scrollTo({ top: $("tabsAnchor").offsetTop, behavior:"auto" }); };
    document.getElementById("exPrint").onclick = () => window.print();
    document.getElementById("exOut").onclick = onBack;
  }
}

const FTOP = {
  hh:{ n:"Have / has", e:"🔤", game:"grade", q:"¿Con quién se usa has y con quién have? Dime una oración con «my mom» y otra con «my friends»." },
  pp:{ n:"Past participle", e:"⭐", game:"parts", q:"Dime el past participle de go, eat, see, write y break. ¿Por qué no se dice «she has went»?" },
  ora:{ n:"Oraciones", e:"📝", game:"art", q:"Have you ever eaten sushi? Responde con «Yes, I have» o «No, I haven't» y di una oración tuya." }
};
const FICHA_HIST = "ld5-ficha-hist";
const FOWL = ["¡Anotado! Sigue así 💪", "Lee con calma 🧐", "¡Tú puedes!", "Piensa y luego responde ✨", "¡Vas muy bien!", "Las respuestas se ven al final 🔒"];
const HHDIAG = "Confunde have y has. Has va con he, she, it y una sola persona (my mom); have con I, you, we, they y los plurales.";

function fichaItems(){
  const out = [], H = HARD(), usedV = new Set();
  const vPick = arr => { const c = arr.filter(v => !usedV.has(v.b)); const v = pick(c.length ? c : arr); usedV.add(v.b); return v; };
  // Have / has
  const s1 = pick(SUBJ), v1 = vPick(VERBS), c1 = pick(COMP[v1.b]);
  out.push({ top:"hh", kind:"choice", q:`Completa:<span class="feq">${esc(s1.s)} ___ ${esc(v1.pp)} ${esc(c1)}.</span>`, opts:["have","has"], ans:s1.h, why:HH_D[s1.h], diag:() => HHDIAG });
  const s2 = pick(SUBJ.filter(x => x.h !== s1.h)), v2 = vPick(VERBS), c2 = pick(COMP[v2.b]), n2 = s2.h === "have" ? "haven't" : "hasn't";
  out.push({ top:"hh", kind:"choice", q:`Completa en negativo:<span class="feq">${esc(s2.s)} ___ ${esc(v2.pp)} ${esc(c2)}.</span>`, opts:["haven't","hasn't","don't"], ans:n2, why:`${s2.h} + not`,
    diag:v => v === "don't" ? "Usa «don't» en vez de haven't / hasn't. En el Present Perfect el negativo es have / has + not." : HHDIAG });
  const s3 = pick(SUBJ.filter(x => x.s !== "I")), v3 = vPick(VERBS), c3 = pick(COMP[v3.b]);
  out.push({ top:"hh", kind:"choice", q:`Completa la pregunta:<span class="feq">___ ${esc(lowS(s3.s))} ${esc(v3.pp)} ${esc(c3)}?</span>`, opts:["Have","Has","Did"], ans:cap(s3.h), why:"have / has va al principio",
    diag:v => v === "Did" ? "Usa «did» (pasado simple). En el Present Perfect la pregunta empieza con have / has." : HHDIAG });
  // Past participle
  for(let k = 0; k < 2; k++){ const v = vPick(CLEAR_IRR);
    out.push({ top:"pp", kind:"choice", q:`Past participle de «<b>${esc(v.b)}</b>» ${v.e}`, opts:shuffle([v.pp, ...wrongPP(v).slice(0, 3)]), ans:v.pp, why:`${v.b} → ${v.ps} → ${v.pp}`,
      diag:x => x === v.ps.split(" / ")[0] ? "Confunde el pasado simple con el past participle (went / gone). Repasen la tercera columna de la pestaña Verbos." : /ed$/.test(x) ? "Le pone -ed a verbos irregulares (eated, goed). Hay que memorizar los irregulares." : "Aún no se sabe los participios irregulares. Practiquen con Memoria de verbos." }); }
  const rv = vPick(REG.filter(v => !v.alt));
  out.push({ top:"pp", kind:"choice", q:`Past participle de «<b>${esc(rv.b)}</b>» ${rv.e}`, opts:shuffle([rv.pp, rv.b, rv.b + "ing", rv.b + "en"]), ans:rv.pp, why:"regular: -ed",
    diag:() => "No recuerda que los verbos regulares forman el participio con -ed." });
  const tP = pick(TEXTOS), toksP = parseTexto(tP), kP = toksP.findIndex(y => y.c === "P");
  out.push({ top:"pp", kind:"tap", q:'Toca el <b class="hcP">PAST PARTICIPLE</b>', toks:toksP, ansK:kP, ans:toksP[kP].w, why:"es el verbo que va después de have / has",
    diag:x => { const t = toksP.find(y => y.w === x); return t?.c === "H" ? "Confunde el participio con have / has. El participio es el verbo que va DESPUÉS." : "Le cuesta encontrar el participio en la oración. Jueguen Detective."; } });
  // Oraciones
  const so = pick(SUBJ), vo = vPick(VERBS.filter(v => COMP[v.b].some(c => c.split(" ").length <= 2))), co = pick(COMP[vo.b].filter(c => c.split(" ").length <= 2));
  const sent = `${so.s} ${so.h} ${vo.pp} ${co}`, words = sent.split(" ");
  out.push({ top:"ora", kind:"order", q:"Ordena las palabras para formar la oración", words:shuffle(words.map((w, k) => ({ w, k }))).map(x => x.w), ans:sent, why:"sujeto + have/has + past participle + …",
    diag:() => "Le cuesta el orden de la oración: sujeto + have / has + past participle + complemento. Jueguen El tren de la oración." });
  const sc = pick(SUBJ), vc = vPick(CLEAR_IRR), cc = pick(COMP[vc.b]), other = sc.h === "have" ? "has" : "have";
  const ok = `${sc.s} ${sc.h} ${vc.pp} ${cc}.`, bad1 = `${sc.s} ${sc.h} ${vc.ps.split(" / ")[0]} ${cc}.`, bad2 = `${sc.s} ${other} ${vc.pp} ${cc}.`, bad3 = `${sc.s} ${vc.pp} ${cc}.`;
  out.push({ top:"ora", kind:"choice", q:"¿Cuál oración está <b>bien escrita</b>?", opts:shuffle([ok, bad1, bad2, bad3]), ans:ok, why:`${sc.h} + ${vc.pp}`,
    diag:x => x === bad1 ? "Usa el pasado simple después de have / has (has went). Va el participio (has gone)." : x === bad2 ? HHDIAG : "Olvida el have / has: siempre va antes del participio." });
  const [en, es] = pick(EJEMPLOS.slice(0, 5));
  out.push({ top:"ora", kind:"choice", q:`¿Qué significa?<span class="feq">${esc(en)}</span>`, opts:shuffle([es, ...shuffle(EJEMPLOS.slice(0, 5).filter(x => x[0] !== en)).slice(0, 2).map(x => x[1])]), ans:es, why:"",
    diag:() => "Le cuesta entender el significado. Recuerden: have / has + participio = he / ha + …ado / …ido." });
  return out.map(x => ({ ...x, v:"", vk:null, seq:[], first:null, fixed:false, vFirst:"" }));
}

function fichaMission(attempt){
  attempt = attempt || 1;
  const items = fichaItems(), N = items.length;
  let stage = "play", cur = 0, secs = 0, fixUsed = false, owl = FOWL[0], saved = false;
  const isOk = it => it.kind === "tap" ? it.vk === it.ansK : it.v === it.ans;
  const pts = () => items.reduce((s, it) => s + (it.first ? 10 : it.fixed ? 5 : 0), 0);
  const nota = () => Math.max(1, Math.round(pts() * 100 / (N * 10)));
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const queue = () => stage === "fixing" ? items.map((it, i) => it.first ? -1 : i).filter(i => i >= 0) : items.map((_, i) => i);

  box.innerHTML = `<div class="pane"><div class="card fcard">
      <div class="fhead"><h2>🎯 Misión ficha</h2><span class="fmeta">Intento #${attempt} · ⏱️ <b id="fT">0:00</b></span></div>
      <div class="frules">Responde las ${N} preguntas. Lulo 🦉 no te dice si está bien hasta que entregues. ¡Al final verás tu nota de 1 a 100!</div>
      <div class="ftrack" id="fTrack"></div>
      <div id="fStage"></div>
    </div><div id="fReport"></div></div>`;
  const timer = setInterval(() => { if(!$("fT")) return clearInterval(timer); if(stage === "play" || stage === "review"){ secs++; $("fT").textContent = fmt(secs); } }, 1000);

  function track(){
    const q = queue();
    $("fTrack").innerHTML = items.map((it, i) => {
      let c = "fst";
      if(stage === "graded" || stage === "done") c += it.first ? " ok" : it.fixed ? " fix" : " no";
      else if(stage === "fixing") c += it.first ? " ok off" : it.v ? " done" : " todo";
      else if(it.v) c += " done";
      if(i === cur && (stage === "play" || stage === "fixing")) c += " cur";
      return `<button class="${c}" data-i="${i}" aria-label="Pregunta ${i + 1}" ${q.includes(i) && stage !== "graded" && stage !== "done" ? "" : "disabled"}><span>${i + 1}</span>${i === cur && (stage === "play" || stage === "fixing") ? `<i aria-hidden="true">🦉</i>` : ""}</button>`;
    }).join("");
    $("fTrack").querySelectorAll(".fst").forEach(b => b.onclick = () => { cur = Number(b.dataset.i); SFX.flip(); play(); });
  }

  function slotText(it){
    if(!it.v) return `<span class="ph">${it.kind === "order" ? "toca las palabras en orden" : it.kind === "tiles" ? "toca las letras" : "?"}</span>`;
    return esc(it.v) + (it.suf || "");
  }
  function play(){
    stage = stage === "fixing" ? "fixing" : "play";
    const it = items[cur], q = queue(), pos = q.indexOf(cur), last = pos === q.length - 1, T = FTOP[it.top];
    let pad = "";
    if(it.kind === "tiles"){
      const L = HARD() ? ["I","V","X","L","C","D","M"] : ["I","V","X","L","C"];
      pad = `<div class="symbols ftiles" style="grid-template-columns:repeat(${L.length > 5 ? 4 : 5},minmax(0,1fr))">${L.map(c => `<button class="sym" data-c="${c}"><b>${c}</b></button>`).join("")}<button class="sym fdel" data-del aria-label="Borrar">⌫</button></div>`;
    }
    if(it.kind === "num") pad = `<div class="fkeys">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join("")}<button data-clr class="fk2">Borrar todo</button><button data-k="0">0</button><button data-del class="fk2" aria-label="Borrar">⌫</button></div>`;
    if(it.kind === "order") pad = `<div class="artchips wchips forder">${it.words.map((w, k) => `<button class="achip ochip" data-on="${k}" ${it.seq.includes(k) ? "disabled" : ""}>${esc(w)}</button>`).join("")}</div><div class="wbtns"><button class="btn ghost" data-odel>⌫ Quitar</button><button class="btn ghost" data-oclr>Borrar todo</button></div>`;
    if(it.kind === "tap") pad = `<div class="sentence ftap">${it.toks.map((t, k) => `<button class="tok ftk ${it.vk === k ? "sel" : ""}" data-tk="${k}">${esc(t.w)}</button>${t.p ? `<span class="punct">${t.p}</span>` : ""}`).join(" ")}</div>`;
    if(it.kind === "choice") pad = `<div class="fchoices">${it.opts.map(o => `<button class="fch ${it.v === o ? "sel" : ""}" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    $("fStage").innerHTML = `<div class="fq t-${it.top}">
        <div class="ftop"><span>${T.e} ${T.n}</span><span>${stage === "fixing" ? `Corrección ${pos + 1} de ${q.length}` : `Pregunta ${cur + 1} de ${N}`}</span></div>
        <div class="fqt">${it.q}</div>
        ${it.img ? `<div class="fimg">${it.img}</div>` : ""}
        ${it.kind === "choice" || it.kind === "tap" ? "" : `<div class="fslot k-${it.kind}" id="fSlot" aria-live="polite">${slotText(it)}</div>`}
        ${pad}
        <div class="fowl"><span>🦉</span><p>${esc(stage === "fixing" ? "Esta la tenías mal. ¡Piénsala otra vez con calma!" : owl)}</p></div>
        <div class="fnav"><button class="btn ghost" id="fPrev" ${pos === 0 ? "disabled" : ""}>← Atrás</button>
          <button class="btn" id="fNext">${last ? (stage === "fixing" ? "📤 Entregar correcciones" : "📋 Revisar y entregar") : "Siguiente →"}</button></div>
      </div>`;
    track();
    const upd = () => { const s = $("fSlot"); if(s){ s.innerHTML = slotText(it); s.classList.remove("pop2"); void s.offsetWidth; s.classList.add("pop2"); } track(); };
    $("fStage").querySelectorAll("[data-c]").forEach(b => b.onclick = () => { if(it.v.length >= 12) return; it.v += b.dataset.c; beep([400 + RV[b.dataset.c] % 600], .06, "triangle", 0, .07); upd(); });
    $("fStage").querySelectorAll("[data-k]").forEach(b => b.onclick = () => { if(it.v.length >= 4 || (it.v === "0")) return; it.v += b.dataset.k; beep([440 + Number(b.dataset.k) * 40], .05, "sine", 0, .07); upd(); });
    $("fStage").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { it.v = it.v.slice(0, -1); SFX.flip(); upd(); });
    $("fStage").querySelectorAll("[data-clr]").forEach(b => b.onclick = () => { it.v = ""; SFX.flip(); upd(); });
    $("fStage").querySelectorAll(".fch").forEach(b => b.onclick = () => {
      it.v = b.dataset.o; SFX.flip();
      $("fStage").querySelectorAll(".fch").forEach(x => x.classList.toggle("sel", x === b)); track();
      if(!last) setTimeout(() => { if(items[cur] === it && $("fStage").contains(b)) next(); }, 450);
    });
    $("fStage").querySelectorAll(".ftk").forEach(b => b.onclick = () => {
      const k = Number(b.dataset.tk); it.vk = k; it.v = it.toks[k].w; SFX.flip();
      $("fStage").querySelectorAll(".ftk").forEach(x => x.classList.toggle("sel", x === b)); track();
      if(!last) setTimeout(() => { if(items[cur] === it && $("fStage").contains(b)) next(); }, 500);
    });
    const oupd = () => { it.v = it.seq.map(k => it.words[k]).join(" "); $("fStage").querySelectorAll(".ochip").forEach(b => b.disabled = it.seq.includes(Number(b.dataset.on))); upd(); };
    $("fStage").querySelectorAll(".ochip").forEach(b => b.onclick = () => { const k = Number(b.dataset.on); if(it.seq.includes(k)) return; it.seq.push(k); beep([400 + it.seq.length * 50], .06, "triangle", 0, .07); oupd(); });
    $("fStage").querySelector("[data-odel]")?.addEventListener("click", () => { it.seq.pop(); SFX.flip(); oupd(); });
    $("fStage").querySelector("[data-oclr]")?.addEventListener("click", () => { it.seq = []; SFX.flip(); oupd(); });
    $("fPrev").onclick = () => { if(pos > 0){ cur = q[pos - 1]; SFX.flip(); play(); } };
    $("fNext").onclick = () => last ? (stage === "fixing" ? sendFix() : review()) : next();
    function next(){ cur = q[pos + 1]; owl = pick(FOWL); SFX.flip(); play(); scrollTop(); }
  }
  const scrollTop = () => { const t = $("fTrack"); if(t && t.getBoundingClientRect().top < 0) t.scrollIntoView({ behavior:"smooth", block:"start" }); };

  function review(){
    stage = "review"; track();
    const missing = items.map((it, i) => it.v ? -1 : i).filter(i => i >= 0);
    $("fStage").innerHTML = `<div class="fsum"><h3>📋 Antes de entregar</h3>
      <p>Respondiste <b>${N - missing.length} de ${N}</b>. Toca una pregunta si quieres cambiarla.</p>
      <div class="fgrid">${items.map((it, i) => `<button data-i="${i}" class="${it.v ? "" : "miss"}"><small>${i + 1}. ${FTOP[it.top].e}</small><b>${it.v ? esc(it.v) + (it.suf || "") : "—"}</b></button>`).join("")}</div>
      <p class="err" id="fErr" role="alert">${missing.length ? `Te ${missing.length === 1 ? "falta 1 pregunta" : `faltan ${missing.length} preguntas`}. Si no sabes alguna, escribe tu mejor respuesta.` : ""}</p>
      <div class="factions"><button class="btn" id="fSend" ${missing.length ? "disabled" : ""}>📤 Entregar ficha</button>
      <button class="btn ghost locked" disabled>🔒 Respuestas (al terminar)</button></div></div>`;
    $("fStage").querySelectorAll(".fgrid button").forEach(b => b.onclick = () => { cur = Number(b.dataset.i); play(); });
    $("fSend").onclick = send;
  }

  function send(){
    items.forEach(it => { it.first = isOk(it); it.vFirst = it.v; });
    stage = "graded";
    if(items.every(it => it.first)) return finishAll();
    result();
  }
  function sendFix(){
    const miss = queue().filter(i => !items[i].v);
    if(miss.length){ cur = miss[0]; play(); $("fStage").querySelector(".fowl p").textContent = "Te falta corregir esta. ¡Escribe tu mejor respuesta!"; return; }
    items.forEach(it => { if(!it.first) it.fixed = isOk(it); });
    stage = "graded"; result();
  }

  function scoreCard(){
    const n = nota(), L = nivel100(n), firstOk = items.filter(it => it.first).length, fixed = items.filter(it => it.fixed).length, wrongs = N - firstOk;
    const stars = n >= 90 ? 3 : n >= 70 ? 2 : 1;
    return `<div class="fres ${L[2]}">
        <div class="fscore"><span class="flabel">Tu nota</span><b id="fNum">0</b><small>de 100</small></div>
        <div class="flevel">${L[1]} Desempeño ${L[0]}</div>
        <div class="fstars">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
        <p><b>${firstOk} de ${N}</b> bien al primer intento${fixUsed ? ` · corregiste <b>${fixed} de ${wrongs}</b>` : ""}.</p>
        <p class="fpts">Cada respuesta buena vale 10 puntos. Cada error que corriges vale 5.</p>
      </div>`;
  }
  function countUp(){
    const el = $("fNum"), n = nota(); let v = 0;
    const step = () => { if(!el.isConnected) return; v = Math.min(n, v + Math.max(1, Math.ceil(n / 30))); el.textContent = v; if(v < n) requestAnimationFrame(step); else{ el.parentElement.classList.add("pop2"); if(n >= 80){ try{ SFX.win(); confetti($("fStage")); }catch(e){} } } };
    requestAnimationFrame(step);
  }
  function result(){
    record(KEY, "ficha100", nota());
    track();
    const canFix = !fixUsed && items.some(it => !it.first);
    $("fStage").innerHTML = `${scoreCard()}
      <div class="fowl"><span>🦉</span><p>${canFix ? "Las que tienen rojo están mal. Tienes <b>una oportunidad</b> para corregirlas, ¡y subir tu nota!" : "¡Bien hecho! Ahora mira las respuestas para aprender de los errores."}</p></div>

  function finishAll(){
    stage = "done"; record(KEY, "ficha100", nota()); track(); saveHist();
    $("fStage").innerHTML = `${scoreCard()}
      <h3 class="fh3">📖 Respuestas</h3>
      <div class="fans">${items.map((it, i) => {
        const st = it.first ? "ok" : it.fixed ? "fix" : "no";
        return `<div class="fa ${st}"><div class="fan">${i + 1}</div><div>
          <p class="faq">${it.q.replace(/<span class="feq">/g, " ").replace(/<[^>]+>/g, "").replace(/\s+/g, " ")}</p>
          <p>Tu respuesta: <b>${esc(it.vFirst) + (it.suf || "")}</b>${it.fixed ? ` → corregida: <b>${esc(it.v) + (it.suf || "")}</b>` : ""} ${st === "ok" ? "✅" : st === "fix" ? "🟡" : "❌"}</p>
          ${st === "ok" ? "" : `<p class="fsol">Correcta: <b>${esc(it.ans) + (it.suf || "")}</b>${it.why ? ` · ${esc(it.why)}` : ""}</p>`}</div></div>`; }).join("")}</div>
      <div class="factions"><button class="btn" id="fRetry">🔁 Volver a intentar con ejercicios nuevos</button></div>`;
    countUp();
    $("fRetry").onclick = () => { fichaMission(attempt + 1); window.scrollTo({ top: $("tabsAnchor").offsetTop, behavior:"auto" }); };
    report();
  }

  function byTopic(){
    const r = {};
    Object.keys(FTOP).forEach(t => { const its = items.filter(it => it.top === t); r[t] = [its.filter(it => it.first).length, its.length]; });
    return r;
  }
  function saveHist(){
    if(saved) return; saved = true;
    const h = readJSON(FICHA_HIST, []);
    h.push({ d:new Date().toISOString().slice(0, 10), n:nota(), s:secs, t:byTopic(), h:HARD() ? 1 : 0 });
    store(FICHA_HIST, h.slice(-12));
  }

  function report(){
    const n = nota(), L = nivel100(n), T = byTopic(), h = readJSON(FICHA_HIST, []), name = esc(kid().name);
    const weak = Object.keys(FTOP).filter(t => T[t][0] < T[t][1]).sort((a, b) => T[a][0] / T[a][1] - T[b][0] / T[b][1]);
    const reforzar = weak.map(t => {
      const msgs = uniq(items.filter(it => it.top === t && !it.first).map(it => it.diag(it.vFirst)));
      const g = GAMES.find(x => x.id === FTOP[t].game);
      return `<div class="frf"><b>${FTOP[t].e} ${FTOP[t].n}</b><ul>${msgs.map(m => `<li>${esc(m)}</li>`).join("")}</ul>
        ${g ? `<button class="btn ghost fgo" data-g="${g.id}">🎮 Practicar con «${esc(g.name)}»</button>` : ""}</div>`;
    }).join("");
    const last = h.slice(-6), first = h[0], prev = h.length > 1 ? h[h.length - 2] : null;
    const trend = !prev ? "Este es el primer registro. Cada vez que haga la ficha verás aquí su avance."
      : n > prev.n ? `Subió ${n - prev.n} puntos frente a la vez anterior (${prev.n} → ${n}). ¡Felicítenlo!`
      : n < prev.n ? `Bajó ${prev.n - n} puntos frente a la vez anterior (${prev.n} → ${n}). Es normal: los ejercicios cambian. Repasen el tema más débil.`
      : `Sacó lo mismo que la vez anterior (${n}).`;
    const avgT = Math.round(secs / N);
    $("fReport").innerHTML = `<div class="card freport">
      <h2>👨‍👧 Reporte para papá y mamá</h2>
      <p class="muted" style="margin:0 0 8px">Ficha de ${name} · ${new Date().toLocaleDateString("es-CO", { day:"numeric", month:"long" })} · modo ${HARD() ? "difícil" : "normal"}</p>
      <div class="frgrid"><div><span>Nota</span><b>${n}<small>/100</small></b></div><div><span>Desempeño</span><b>${L[0]}</b></div>
        <div><span>Tiempo</span><b>${fmt(secs)}</b></div><div><span>Por pregunta</span><b>${avgT} s</b></div></div>
      <h3>Por tema (primer intento)</h3>
      <div class="fbars">${Object.keys(FTOP).map(t => { const [a, b] = T[t], p = Math.round(a / b * 100); return `<div class="fbr"><span>${FTOP[t].e} ${FTOP[t].n}</span><div class="fbt"><i style="width:${p}%" class="${p === 100 ? "cg" : p >= 50 ? "cm" : "cb"}"></i></div><b>${a}/${b}</b></div>`; }).join("")}</div>
      <h3>🎯 Qué reforzar</h3>
      ${weak.length ? reforzar : `<p style="margin:0">¡Todo bien al primer intento! ${name} está listo. Pueden subir a <b>modo difícil</b> o presentar el <b>Simulacro</b> en Juegos.</p>`}
      ${avgT < 12 && n < 80 ? `<p class="fwarn">⚡ Respondió muy rápido (${avgT} s por pregunta). Puede que esté adivinando: pídele que lea en voz alta antes de responder.</p>` : ""}
      <h3>📈 Progreso</h3>
      <div class="fhist">${last.map(x => `<div><b>${x.n}</b><i style="height:${Math.max(6, x.n)}%" class="${x.n >= 80 ? "cg" : x.n >= 60 ? "cm" : "cb"}"></i><small>${x.d.slice(8, 10)}/${x.d.slice(5, 7)}</small></div>`).join("")}</div>
      <p style="margin:6px 0 0">${esc(trend)}${first && h.length > 2 && n > first.n ? ` Desde el primer intento ha subido ${n - first.n} puntos.` : ""}</p>
      <h3>💬 Pregúntale hoy</h3>
      <p style="margin:0">${esc(FTOP[weak[0] || "hh"].q)}</p>
      <p class="muted fscale">Escala: ${ESCALA100}. Cada respuesta buena al primer intento vale 10 puntos y cada error corregido vale 5. Los ejercicios cambian en cada intento, así que la nota muestra lo que de verdad sabe.</p>
    </div>`;
    $("fReport").querySelectorAll(".fgo").forEach(b => b.onclick = () => {
      const g = GAMES.find(x => x.id === b.dataset.g); select("juegos");
      const back = () => { window.scrollTo({ top: $("tabsAnchor").offsetTop, behavior:"auto" }); gamesMenu(box, KEY); };
      g.run(box, s => { record(KEY, fieldOf(g.f), s); return null; }, back);
    });
  }

  play();
}

function select(id){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === id));
  try{ speechSynthesis.cancel() }catch(e){}
  panes[id]();
  const top = $("tabsAnchor").getBoundingClientRect().top + window.scrollY; if(window.scrollY > top) window.scrollTo({ top, behavior:"auto" });
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => select(t.dataset.tab));

// ---------- Nombre ----------
function renderName(){ $("forWho").textContent = childName ? `Para ${childName}` : ""; }
function askName(){ $("nameIn").value = childName; $("nameBox").classList.remove("hidden"); setTimeout(() => $("nameIn").focus(), 50); }
function saveName(){
  const n = $("nameIn").value.trim(); if(!n){ $("nameIn").focus(); return; }
  childName = n; store("ld5-name", n); $("nameBox").classList.add("hidden"); renderName();
  const cur = document.querySelector('.tab[aria-selected="true"]')?.dataset.tab || "aprender"; panes[cur]();
}
$("nameOk").onclick = saveName;
$("nameIn").addEventListener("keydown", e => { if(e.key === "Enter") saveName(); });
$("editName").onclick = askName;

renderName();
panes.aprender();
if(!childName) askName();
</script>
</body>
</html>
