<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Present Perfect · Alejandro</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#eaf6ff; --ink:#1f2544; --card:#ffffff; --muted:#4a5075; --line:#1f2544; --soft:#f3f8ff;
  --sun:#ffcf3f; --pink:#ff6b9a; --green:#35b862; --blue:#59c3ff; --bad:#d6414f; --wa:#25d366;
  --f-head:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Trebuchet MS",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121a33; --ink:#f2f4ff; --card:#1f2a4d; --muted:#b9c0e6; --line:#0a0f22; --soft:#26335c; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#121a33; --ink:#f2f4ff; --card:#1f2a4d; --muted:#b9c0e6; --line:#0a0f22; --soft:#26335c; color-scheme:dark; }
*{box-sizing:border-box}
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-weight:700; font-size:17px; line-height:1.45}
h1,h2,h3{font-family:var(--f-head); font-weight:800; line-height:1.1; margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:4px solid var(--sun); outline-offset:2px}
.wrap{max-width:560px; margin:0 auto; padding:18px 16px 40px}
.card{background:var(--card); border:3px solid var(--line); border-radius:24px; box-shadow:5px 5px 0 var(--line); padding:18px}
.muted{color:var(--muted)}
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; font-family:var(--f-head); font-weight:800; font-size:1.15em;
  background:var(--pink); color:#fff; border:3px solid var(--line); border-radius:999px; padding:10px 22px; box-shadow:4px 4px 0 var(--line); cursor:pointer; text-decoration:none}
.btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--line)}
.btn.wa{background:var(--wa); color:#0a2a14}
.btn.ghost{background:var(--card); color:var(--ink)}
.link{background:none; border:0; color:var(--muted); text-decoration:underline; cursor:pointer; padding:6px}
.hidden{display:none !important}
input,select,textarea{width:100%; background:var(--soft); border:3px solid var(--line); border-radius:16px; padding:11px 14px; font-weight:700}
textarea{resize:vertical; min-height:70px}
label{display:block; font-weight:800; margin:14px 0 6px}

/* Login */
#login{min-height:100%; display:flex; align-items:center}
.brand{display:flex; align-items:center; gap:12px; margin-bottom:22px}
.logo{width:56px; height:56px; border-radius:18px; background:var(--sun); border:3px solid var(--line); box-shadow:3px 3px 0 var(--line); display:grid; place-items:center; font-size:30px; flex:none}
.brand h1{font-size:2em}
.login-card h2{font-size:1.6em; margin-bottom:4px}
.code{text-transform:uppercase; letter-spacing:.12em; font-family:var(--f-head); font-size:1.4em; text-align:center}
.err{color:var(--bad); margin:8px 0 0; min-height:1.4em}
.demo-hint{background:var(--soft); border:2px dashed var(--line); border-radius:14px; padding:8px 12px; margin-top:14px; font-size:.92em}

/* Home */
.top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px}
.top .brand{margin:0}
.top .brand h1{font-size:1.35em}
.top .logo{width:44px; height:44px; font-size:24px; border-radius:14px}
.hello{background:var(--blue); color:#10233a; position:relative; overflow:hidden}
.hello h2{font-size:1.9em}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.chip{background:var(--sun); color:#1f2544; border:2px solid #1f2544; border-radius:999px; padding:2px 12px; font-size:.9em; font-weight:800}
.chip.ok{background:#bff0cf}
.hello .kid{position:absolute; right:10px; bottom:-6px; font-size:84px; line-height:1}
.hello .txt{padding-right:80px}
.send{margin-top:18px; background:var(--pink); color:#fff; text-align:left; cursor:pointer; width:100%; display:flex; align-items:center; gap:14px}
.send .ico{font-size:44px; flex:none}
.send h3{font-size:1.5em}
.send p{margin:2px 0 0; opacity:.95}
.send:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--line)}
section{margin-top:26px}
section > h2{font-size:1.45em; margin-bottom:10px}
.list{display:grid; gap:14px}
.lesson{display:flex; gap:14px; align-items:center; cursor:pointer; text-align:left; width:100%}
.lesson:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--line)}
.badge{width:62px; height:62px; flex:none; border-radius:18px; border:3px solid var(--line); display:grid; place-items:center; font-size:32px}
.lesson h3{font-size:1.2em}
.lesson p{margin:2px 0 0; font-size:.92em}
.open{margin-left:auto; flex:none; font-family:var(--f-head); font-weight:800; background:var(--sun); border:3px solid var(--line); border-radius:999px; padding:4px 14px}
.steps{display:flex; gap:6px; margin-top:12px}
.step{flex:1; text-align:center; font-size:.8em; font-weight:800; color:var(--muted)}
.step i{display:block; height:10px; border-radius:99px; border:2px solid var(--line); background:var(--soft); margin-bottom:4px}
.step.done i{background:var(--green)} .step.now i{background:var(--sun); animation:pulse 1.4s ease-in-out infinite}
.step.done,.step.now{color:var(--ink)}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){ .step.now i{animation:none} }
.eta{margin-top:8px; font-size:.9em}
.help{margin-top:26px; text-align:center}
.empty{border-style:dashed; box-shadow:none; text-align:center; color:var(--muted)}

/* Sheet */
.scrim{position:fixed; inset:0; background:rgba(15,20,40,.55); z-index:20; display:flex; align-items:flex-end; justify-content:center}
.sheet{width:100%; max-width:560px; max-height:92%; overflow:auto; background:var(--card); border:3px solid var(--line); border-bottom:0; border-radius:26px 26px 0 0; padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:1.6em}
.photo{display:flex; align-items:center; justify-content:center; gap:10px; min-height:120px; border:3px dashed var(--line); border-radius:18px; background:var(--soft); cursor:pointer; overflow:hidden; position:relative}
.photo img{width:100%; max-height:220px; object-fit:contain; display:block}
.photo input{position:absolute; inset:0; opacity:0; cursor:pointer}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.sheet .actions{display:grid; gap:10px; margin-top:18px}
.note{font-size:.88em; margin-top:10px}

/* Lesson viewer */
#viewer{position:fixed; inset:0; z-index:30; background:var(--bg); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px)}
.vbar{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:3px solid var(--line); background:var(--card)}
.vbar button{flex:none; width:auto; font-size:1em; padding:6px 16px}
.vbar strong{font-family:var(--f-head); font-size:1.1em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#viewer iframe{flex:1; width:100%; border:0; background:var(--bg)}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; z-index:40; font-weight:800; max-width:90%; text-align:center}

/* Generación */
.gen{position:fixed; inset:0; z-index:35; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px}
.gen .card{max-width:420px; width:100%; text-align:center}
.gen .big{font-size:72px; line-height:1; display:inline-block; animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}
@media (prefers-reduced-motion: reduce){ .gen .big{animation:none} }
.gen h2{font-size:1.6em; margin:12px 0 6px}
.bar{height:14px; border:3px solid var(--line); border-radius:99px; background:var(--soft); overflow:hidden; margin:16px 0}
.bar i{display:block; height:100%; width:5%; background:var(--green); transition:width .8s ease}
.gen .actions{margin-top:14px}
.prof{cursor:pointer; background:none; border:0; padding:0; text-align:left}
.chip.edit{background:#fff}
.alt-link{display:block; text-align:center; margin-top:8px}

/* Lección generada */
#lessonView{flex:1; overflow:auto; background:var(--bg)}
.lv{max-width:640px; margin:0 auto; padding:16px 16px 48px}
.lv-hero{background:var(--green); color:#0d2a17}
.lv-hero h1{font-size:1.8em}
.lv-hero .small{font-size:.85em; opacity:.85}
.tabs{display:flex; gap:8px; overflow-x:auto; padding:14px 2px 6px; margin:0 -2px}
.tab{flex:none; background:var(--card); border:3px solid var(--line); border-radius:999px; padding:6px 16px; font-family:var(--f-head); font-weight:800; font-size:1em; cursor:pointer; box-shadow:3px 3px 0 var(--line)}
.tab[aria-selected="true"]{background:var(--green); color:#0d2a17}
.pane{display:grid; gap:14px; margin-top:8px}
.pane h2{font-size:1.35em; margin-bottom:6px}
.say{margin-top:8px; background:var(--soft); border-radius:14px; padding:8px 12px; font-style:italic}
.stepn{display:inline-grid; place-items:center; width:30px; height:30px; border-radius:50%; background:var(--green); color:#0d2a17; border:2px solid var(--line); font-family:var(--f-head); margin-right:8px}
.words{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px}
.word{background:var(--card); border:3px solid var(--line); border-radius:18px; box-shadow:3px 3px 0 var(--line); padding:10px; text-align:center; cursor:pointer}
.word b{display:block; font-family:var(--f-head); font-size:1.3em}
.word span{font-size:.85em; color:var(--muted)}
.word:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line)}
.ghead{display:flex; justify-content:space-between; align-items:center}
.stars{background:var(--sun); color:#1f2544; border:2px solid #1f2544; border-radius:999px; padding:0 12px; font-weight:800}
.dots{display:flex; gap:5px; justify-content:center; margin:10px 0}
.dots i{width:12px; height:12px; border-radius:50%; border:2px solid var(--line)}
.dots i.on{background:var(--sun)}
.item{text-align:center; margin:8px 0}
.item .em{font-size:56px; line-height:1.1}
.item .tx{font-family:var(--f-head); font-size:1.5em; font-weight:800; display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap}
.spk{background:#d6f0ff; color:#10233a; border:3px solid var(--line); border-radius:14px; padding:2px 10px; cursor:pointer; font-size:.8em}
.choices{display:grid; gap:10px; margin-top:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{background:var(--card); border:3px solid var(--line); border-radius:16px; padding:10px; font-weight:800; cursor:pointer; box-shadow:3px 3px 0 var(--line); font-size:1.05em}
.choices.two .choice:nth-child(1){background:var(--blue); color:#10233a}
.choices.two .choice:nth-child(2){background:#ff9a4d; color:#2a1400}
.choice.right{background:var(--green) !important; color:#0d2a17 !important}
.choice.wrong{background:var(--bad) !important; color:#fff !important}
.choice:disabled{cursor:default}
.fb{min-height:1.5em; margin-top:10px; text-align:center}
.next{width:auto; margin:12px auto 0; display:flex}
.done{text-align:center}
.done .em{font-size:60px}
.fitem{display:grid; gap:6px; padding:10px 0; border-bottom:2px dashed var(--soft)}
.fitem input{padding:8px 12px}
.fitem.ok input{border-color:var(--green); background:#dff7e6}
.fitem.no input{border-color:var(--bad)}
.fitem .ans{font-size:.9em; color:var(--muted)}
.btnrow{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.score{text-align:center; font-family:var(--f-head); font-size:1.4em; margin-top:10px}
ul.tight{margin:6px 0 0; padding-left:1.2em}
.kids{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; margin-bottom:8px}
.kidbtn{flex:none; display:flex; align-items:center; gap:6px; background:var(--card); border:3px solid var(--line); border-radius:999px; padding:4px 14px 4px 6px; font-family:var(--f-head); font-weight:800; cursor:pointer; box-shadow:3px 3px 0 var(--line)}
.kidbtn .av{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--soft); font-size:18px}
.kidbtn[aria-pressed="true"]{background:var(--sun); color:#1f2544}
.kidbtn.add{padding:4px 14px; color:var(--muted)}
.stats{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap}
.stat{background:rgba(255,255,255,.55); border:2px solid #1f2544; border-radius:14px; padding:4px 12px; font-weight:800; color:#10233a}
.search{position:relative; margin-top:18px}
.search input{padding-left:44px; background:var(--card)}
.search span{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:20px}
.subjects{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.subj{text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:6px; padding:14px}
.subj .ic{font-size:34px; line-height:1}
.subj h3{font-size:1.15em}
.subj .meta{font-size:.82em; color:var(--muted)}
.pbar{height:9px; border:2px solid var(--line); border-radius:99px; background:var(--soft); overflow:hidden}
.pbar i{display:block; height:100%; background:var(--green)}
.subj:active,.row:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--line)}
.quick{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px}
.quick .card{cursor:pointer; text-align:left; padding:14px; display:flex; gap:10px; align-items:center; font-family:var(--f-head); font-weight:800; font-size:1.05em}
.quick .card span{font-size:28px}
.vhead{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.vhead .btn{width:auto; flex:none; font-size:1em; padding:6px 16px}
.vhead h2{font-size:1.6em}
.grades{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px}
.grade{flex:none; background:var(--card); border:3px solid var(--line); border-radius:999px; padding:4px 14px; font-weight:800; cursor:pointer}
.grade[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.rows{display:grid; gap:10px}
.row{display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer; text-align:left; width:100%; box-shadow:3px 3px 0 var(--line); border-radius:18px}
.row .t{flex:1; font-weight:800; line-height:1.3}
.row .t small{display:block; color:var(--muted); font-weight:700; font-size:.8em}
.tag{flex:none; font-size:.8em; font-weight:800; border:2px solid var(--line); border-radius:999px; padding:2px 10px; white-space:nowrap}
.tag.ready{background:#bff0cf; color:#0d2a17}
.tag.done{background:var(--sun); color:#1f2544}
.tag.ask{background:var(--soft); color:var(--muted); border-style:dashed}
.tag.mine{background:#e3d4ff; color:#2a1a55}
.legend{font-size:.85em; margin:0 0 10px}
.checks{display:grid; gap:8px; margin-top:10px}
.check{display:flex; gap:10px; align-items:center; background:var(--soft); border:2px solid var(--line); border-radius:14px; padding:8px 12px; font-weight:800; cursor:pointer}
.check input{width:22px; height:22px; flex:none; accent-color:var(--green)}
.choices.grid2{grid-template-columns:1fr 1fr}
.empty-note{text-align:center; color:var(--muted); padding:18px}

.tabs{display:grid !important; overflow:visible}
.tab{padding:6px 4px; font-size:.92em; text-align:center}
#goPlay{margin-top:4px}
.tag.ask{font-size:.72em}

.send{margin-top:14px}
#tasksSec{margin-top:18px}
.tasks{display:flex; gap:12px; overflow-x:auto; padding:2px 4px 10px}
.task{flex:none; width:170px; padding:8px; display:flex; flex-direction:column; gap:6px; text-align:left; cursor:pointer}
.task img{width:100%; height:110px; object-fit:cover; border-radius:12px; border:2px solid var(--line)}
.task .tt{font-weight:800; font-size:.9em; line-height:1.2}
.task .tt small{display:block; color:var(--muted); font-size:.8em}
.task .tag{align-self:flex-start}
.tvimg{width:100%; max-height:260px; object-fit:contain; border-radius:14px; border:3px solid var(--line); background:var(--soft); margin-top:10px; cursor:zoom-in; display:block}
.tvimg.big{max-height:none; cursor:zoom-out}
/* ===== Juegos ===== */
.gmenu{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.gcard{display:flex; flex-direction:column; gap:2px; align-items:center; text-align:center; cursor:pointer; color:#1f2544; width:100%; padding:14px 8px}
.gcard:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--line)}
.gcard .gem{font-size:50px; line-height:1; flex:none; animation:wig 2.4s ease-in-out infinite}
.gcard h3{font-size:1.08em}
.gcard p{margin:0 0 2px; font-size:.8em; opacity:.8}
.gstars{font-size:1.05em; letter-spacing:2px}
@keyframes wig{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-12deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}

.arena{position:relative; border:3px solid #1f2544; border-radius:24px; background:linear-gradient(#bfe7ff,#eaf6ff 55%,#fff3cf); color:#1f2544;
  overflow:hidden; min-height:min(640px, calc(100dvh - 90px)); scroll-margin-top:8px; display:flex; flex-direction:column; box-shadow:5px 5px 0 #1f2544; user-select:none; -webkit-user-select:none}
.hud{display:flex; align-items:center; gap:8px; padding:10px 12px 6px}
.hud strong{flex:1; font-family:var(--f-head); font-size:1em; line-height:1.1}
.hbtn{background:#fff; color:#1f2544; border:3px solid #1f2544; border-radius:14px; width:42px; height:42px; font-size:18px; cursor:pointer; flex:none}
.score{background:var(--sun); border:2px solid #1f2544; border-radius:999px; padding:2px 12px; font-weight:800; flex:none}
.score.bump{animation:bounce .45s}
.prog{height:12px; margin:0 12px; border:2px solid #1f2544; border-radius:99px; background:#fff; overflow:hidden}
.prog i{display:block; height:100%; width:0; background:var(--green); transition:width .4s}
.stage{flex:1; position:relative; padding:12px}
.mascot{display:flex; align-items:flex-end; gap:8px; padding:0 12px 12px}
.owl{font-size:46px; line-height:1; display:inline-block; flex:none}
.owl.hop{animation:hop .55s}
.owl.sad{animation:nope .5s}
.bubble{background:#fff; border:3px solid #1f2544; border-radius:16px 16px 16px 4px; padding:6px 12px; font-weight:800; font-size:.95em; flex:1; min-height:2.2em; display:flex; align-items:center}
@keyframes hop{30%{transform:translateY(-16px) rotate(-10deg)}60%{transform:translateY(0) rotate(8deg)}}
@keyframes nope{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes bounce{40%{transform:scale(1.18)}70%{transform:scale(.94)}}
@keyframes shake{20%,60%{translate:-9px 0}40%,80%{translate:9px 0}}
@keyframes popin{from{transform:scale(.2); opacity:0}}
.shake{animation:shake .4s}
.confetti{position:absolute; inset:0; pointer-events:none; z-index:20}

/* Canasta */
.dslot{height:200px; display:flex; align-items:center; justify-content:center}
.dcard{background:#fff; border:3px solid #1f2544; border-radius:22px; box-shadow:5px 5px 0 #1f2544; padding:12px 16px; text-align:center; max-width:290px;
  touch-action:none; cursor:grab; position:relative; z-index:5; animation:popin .35s}
.dcard .em{font-size:56px; line-height:1.1; pointer-events:none}
.dcard .tx{font-family:var(--f-head); font-weight:800; font-size:1.3em; line-height:1.15; pointer-events:none}
.dcard .spk{margin-top:6px}
.dcard.drag{cursor:grabbing; box-shadow:12px 16px 0 rgba(31,37,68,.3); z-index:10}
.dcard.back{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.dcard.fly{transition:transform .45s ease-in, opacity .45s}
.hint{text-align:center; font-weight:800; font-size:.9em; opacity:.75; margin:4px 0 10px}
.bins{display:grid; gap:10px}
.bin{border:3px solid #1f2544; border-radius:18px 18px 28px 28px; min-height:96px; padding:10px 6px; font-family:var(--f-head); font-weight:800; font-size:1.05em;
  cursor:pointer; box-shadow:4px 4px 0 #1f2544; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:#1f2544; transition:transform .15s}
.bin .bi{font-size:28px; line-height:1}
.bin.hot{transform:scale(1.08); outline:4px dashed #1f2544; outline-offset:3px}
.bin.bounce{animation:bounce .5s}

/* Globos */
.qpanel{background:#fff; border:3px solid #1f2544; border-radius:20px; padding:12px 14px; text-align:center; font-family:var(--f-head); font-weight:800; font-size:1.2em; line-height:1.2; box-shadow:4px 4px 0 #1f2544; animation:popin .3s}
.qpanel small{display:block; font-family:var(--f-body); font-size:.65em; opacity:.7}
.sky{display:flex; justify-content:space-around; align-items:flex-start; gap:6px; padding:28px 0 76px; min-height:290px}
.balloon{position:relative; width:31%; max-width:150px; min-height:130px; border-radius:50% 50% 46% 46% / 56% 56% 44% 44%; border:3px solid #1f2544;
  display:flex; align-items:center; justify-content:center; text-align:center; padding:14px 8px; font-weight:800; font-size:.92em; line-height:1.15; cursor:pointer;
  color:#1f2544; box-shadow:inset -10px -14px 0 rgba(0,0,0,.08); animation:bob 3s ease-in-out infinite}
.balloon:nth-child(2){animation-delay:-1s; margin-top:26px}
.balloon:nth-child(3){animation-delay:-2s; margin-top:8px}
.balloon::before{content:""; position:absolute; top:12%; left:18%; width:16%; height:17%; background:rgba(255,255,255,.75); border-radius:50%}
.balloon::after{content:""; position:absolute; bottom:-62px; left:50%; width:2px; height:58px; background:#1f2544; opacity:.6}
.balloon .knot{position:absolute; bottom:-9px; left:calc(50% - 7px); width:14px; height:10px; background:inherit; border:2px solid #1f2544; border-radius:3px 3px 8px 8px}
.balloon.pop{animation:popb .35s forwards}
.balloon.sad{animation:sad .9s forwards; filter:grayscale(1); pointer-events:none}
@keyframes bob{50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes popb{40%{transform:scale(1.35)}100%{transform:scale(1.7); opacity:0}}
@keyframes sad{to{transform:translateY(70px) scale(.75) rotate(-12deg); opacity:.3}}

/* Memoria */
.mgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.mcard{aspect-ratio:1; perspective:600px; cursor:pointer; background:none; border:0; padding:0; color:#1f2544}
.mcard .in{position:relative; width:100%; height:100%; transition:transform .4s; transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border:3px solid #1f2544; border-radius:14px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px; font-weight:800; text-align:center; font-size:.9em; line-height:1.1}
.mcard .f{background:repeating-linear-gradient(45deg,#ff6b9a,#ff6b9a 8px,#ff8db4 8px,#ff8db4 16px); font-size:30px}
.mcard .b{background:#fff; transform:rotateY(180deg)}
.mcard .b .e{font-size:30px}
.mcard .b .w{font-family:var(--f-head); font-size:1.15em}
.mcard.match .b{background:#bff0cf; animation:bounce .5s}

/* Final */
.endg{text-align:center; padding:14px 6px}
.endg .trophy{font-size:84px; line-height:1; animation:popin .5s}
.endg h3{font-size:1.6em; margin:8px 0 4px}
.bigstars{font-size:46px; letter-spacing:6px; margin:6px 0}
.bigstars span{display:inline-block; animation:popin .45s both}
.bigstars span:nth-child(2){animation-delay:.2s} .bigstars span:nth-child(3){animation-delay:.4s}
.bigstars .off{filter:grayscale(1); opacity:.25}
.endg .actions{display:grid; gap:10px; margin-top:14px}
@media (prefers-reduced-motion: reduce){ .balloon,.gcard .gem{animation:none} }

.gtop{display:flex; justify-content:space-between; align-items:center; padding:10px 14px}
.mcard .b .sm{font-size:.8em}
/* Rayo veloz */
.combo{text-align:center; font-family:var(--f-head); font-weight:800; font-size:1.2em; color:#e8590c; min-height:1.4em}
.tfcard{background:#fff; border:3px solid #1f2544; border-radius:22px; box-shadow:5px 5px 0 #1f2544; padding:16px; text-align:center; animation:popin .3s}
.tfcard .tq{font-weight:800; opacity:.8}
.tfcard .ta{font-family:var(--f-head); font-weight:800; font-size:1.6em; line-height:1.15; margin-top:8px}
.tfcard.good{background:#bff0cf} .tfcard.badc{background:#ffd0d4}
.timer{height:16px; margin:16px 4px; border:3px solid #1f2544; border-radius:99px; background:#fff; overflow:hidden}
.timer i{display:block; height:100%; width:100%; background:linear-gradient(90deg,#ff6b6b,#ffcf3f,#35b862)}
.tfbtns{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.tfb{border:3px solid #1f2544; border-radius:22px; box-shadow:4px 4px 0 #1f2544; font-size:44px; padding:14px 6px; cursor:pointer; display:flex; flex-direction:column; align-items:center; color:#1f2544}
.tfb span{font-family:var(--f-head); font-weight:800; font-size:.4em}
.tfb.yes{background:#8ee0a8} .tfb.no{background:#ff9dbd}
.tfb:active{transform:translate(3px,3px); box-shadow:1px 1px 0 #1f2544}
/* Arma la palabra */
.slots{display:flex; flex-wrap:nowrap; justify-content:center; gap:4px; margin:18px 0}
.slot{flex:1 1 0; max-width:40px; min-width:0; height:46px; border:3px solid #1f2544; border-radius:12px; background:#fff; font-family:var(--f-head); font-weight:800; font-size:1.4em; color:#1f2544; cursor:pointer; padding:0}
.slot:empty{background:rgba(255,255,255,.5); border-style:dashed}
.slot.lock{background:#fff1a8} .slot.win{background:#8ee0a8; animation:bounce .5s}
.gap{flex:none; width:12px}
.tiles{display:flex; flex-wrap:wrap; justify-content:center; gap:8px}
.tile{width:46px; height:50px; border:3px solid #1f2544; border-radius:14px; background:var(--sun); box-shadow:3px 3px 0 #1f2544; font-family:var(--f-head); font-weight:800; font-size:1.5em; color:#1f2544; cursor:pointer; padding:0}
.tile:active{transform:translate(2px,2px); box-shadow:1px 1px 0 #1f2544}
.tile.used{visibility:hidden}
.wbtns{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px}
.wbtns .btn{font-size:.95em; padding:8px}
/* Topos */
.field{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px}
.hole{position:relative; height:124px; overflow:hidden; border-radius:0 0 50% 50% / 0 0 30% 30%}
.hole::after{content:""; position:absolute; left:4%; right:4%; bottom:4px; height:28px; background:#6b4423; border:3px solid #1f2544; border-radius:50%; z-index:1}
.mole{position:absolute; left:6%; right:6%; bottom:-100%; height:100%; background:none; border:0; padding:0; cursor:pointer; transition:bottom .22s ease-out; display:flex; flex-direction:column; align-items:center; z-index:2; color:#1f2544}
.hole.up .mole{bottom:14px}
.mole .m{font-size:46px; line-height:1}
.mole .sign{background:#fff; border:2px solid #1f2544; border-radius:8px; padding:2px 4px; font-weight:800; font-size:.76em; line-height:1.1; max-width:100%; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical}
.hole.hit .mole{animation:bounce .4s}
/* Une las parejas */
.links{position:relative; display:grid; grid-template-columns:1fr 1fr; gap:36px}
.lines{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1}
.lcol,.rcol{display:grid; gap:10px; position:relative; z-index:2}
.lk{border:3px solid #1f2544; border-radius:14px; background:#fff; padding:8px; font-weight:800; font-size:.82em; line-height:1.15; min-height:62px; cursor:pointer; box-shadow:3px 3px 0 #1f2544; color:#1f2544}
.lk.R{font-family:var(--f-head); font-size:1em}
.lk.sel{background:var(--sun); transform:scale(1.04)}
.lk.ok{box-shadow:none}
/* ===== Mejoras ===== */
.deco{position:absolute; inset:0; pointer-events:none; z-index:0; overflow:hidden}
.deco span{position:absolute; font-size:34px; opacity:.5; animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-24px)}to{transform:translateX(24px)}}
.hud,.prog,.stage,.mascot{position:relative; z-index:1}
.th-bins{background:linear-gradient(#bfe7ff 0 62%, #a8e59b 62%)}
.th-balloons{background:linear-gradient(#7fcaff, #d8f0ff 70%, #fff)}
.th-balloons .deco span{font-size:54px; opacity:.85}
.th-review{background:linear-gradient(#ffd1e0, #fff3cf)}
.th-mole{background:linear-gradient(#bfe7ff 0 24%, #9fdc86 24%)}
.th-speed{background:linear-gradient(#35285e, #6a4fbf)}
.th-speed .hud strong{color:#fff} .th-speed .combo{color:#ffcf3f}
.th-speed .deco span{opacity:.8; font-size:26px}
.th-word{background:linear-gradient(#fff3c4, #ffe2a8)}
.th-link{background:radial-gradient(#b9e3ff 1.5px, transparent 1.7px) 0 0/18px 18px, #eef8ff}
.th-memory{background:linear-gradient(#ffd6e7, #e7dcff)}
.intro{text-align:center; padding:6px}
.intro .ibig{font-size:90px; line-height:1.1; display:inline-block; animation:wig 2s ease-in-out infinite}
.intro h3{font-size:1.7em; margin:4px 0}
.intro p{font-weight:800; margin:4px 0 0; background:rgba(255,255,255,.8); border-radius:14px; padding:8px 10px}
.intro .hand{font-size:40px; animation:tap 1s ease-in-out infinite; margin:8px 0}
.intro .btn{font-size:1.35em; padding:14px}
@keyframes tap{50%{transform:translateY(10px)}}
.count{font-family:var(--f-head); font-weight:800; font-size:120px; text-align:center; margin-top:70px; color:#1f2544; text-shadow:6px 6px 0 #fff}
.th-speed .count{color:#ffcf3f; text-shadow:6px 6px 0 #1f2544}
.count.tick{animation:popin .45s}
.plus{position:absolute; z-index:30; transform:translateX(-50%); font-family:var(--f-head); font-weight:800; font-size:1.8em; color:#35b862;
  -webkit-text-stroke:1.5px #1f2544; pointer-events:none; white-space:nowrap; animation:plusup .95s forwards}
@keyframes plusup{to{transform:translate(-50%,-70px) scale(1.2); opacity:0}}
.streak{background:#ff9a4d; border:2px solid #1f2544; border-radius:999px; padding:2px 10px; font-weight:800; flex:none; animation:bounce .45s}
.qs{margin-left:6px; vertical-align:middle; font-size:.7em}
.owl.dance{animation:dance .8s ease-in-out infinite}
@keyframes dance{25%{transform:rotate(-14deg) translateY(-8px)}75%{transform:rotate(14deg) translateY(-8px)}}
.sticker-new{margin:14px auto 0; background:#fff; border:3px dashed #1f2544; border-radius:20px; padding:10px; max-width:300px; animation:popin .5s 1s both}
.sticker-new .se{font-size:68px; display:block; animation:spinin 1s 1.1s both}
@keyframes spinin{from{transform:rotate(-540deg) scale(0)}}
/* Álbum */
.album{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
.slotS{aspect-ratio:1; border:3px solid var(--line); border-radius:16px; background:var(--card); display:grid; place-items:center; font-size:34px}
.slotS.lock{background:var(--soft); border-style:dashed; font-size:20px; color:var(--muted)}
.quick{grid-template-columns:1fr 1fr 1fr !important}
.quick .card{flex-direction:column; text-align:center; font-size:.92em !important; padding:12px 6px !important; gap:4px !important}
@media (prefers-reduced-motion: reduce){ .deco span,.intro .ibig,.intro .hand,.owl.dance{animation:none} }
/* ===== Menú ===== */
.gsec{font-size:1.3em; margin:6px 0 -2px}
.gcard{position:relative}
.nw{position:absolute; top:-8px; right:-6px; background:#ff6b9a; color:#fff; border:2px solid #1f2544; border-radius:999px; font-size:.7em; font-weight:800; padding:1px 8px; transform:rotate(8deg)}
.challenges{display:grid; gap:12px}
.chal{display:flex; gap:14px; align-items:center; text-align:left; cursor:pointer; color:#fff; padding:14px 16px}
.chal h3{font-size:1.4em} .chal p{margin:2px 0 4px; font-size:.9em; opacity:.95}
.chal .ce{font-size:58px; line-height:1; flex:none; animation:wig 2.2s ease-in-out infinite}
.chal.cboss{background:linear-gradient(135deg,#5b1a6e,#c2185b)}
.chal.cexam{background:linear-gradient(135deg,#1b4f9c,#2ec4b6)}
.chal .gstars{font-size:.95em}
.chal:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--line)}

/* ===== Lluvia ===== */
.th-rain{background:linear-gradient(#6fb7ff, #cfe9ff 60%, #eaf6ff)}
.rtarget{background:#fff; border:3px solid #1f2544; border-radius:18px; padding:8px 12px; text-align:center; box-shadow:4px 4px 0 #1f2544}
.rtarget span{display:block; font-weight:800; font-size:.85em; opacity:.75}
.rtarget b{font-family:var(--f-head); font-size:1.5em; line-height:1.1}
.rgot{display:flex; gap:6px; justify-content:center; margin-top:4px}
.rgot i{width:18px; height:18px; border-radius:50%; border:2px solid #1f2544; background:#eee}
.rgot i.on{background:#35b862; animation:bounce .4s}
.rt{margin:10px 2px}
.rainbox{position:relative; height:360px; overflow:hidden; border-radius:18px; border:3px dashed rgba(31,37,68,.35); background:rgba(255,255,255,.25)}
.drop{position:absolute; top:-80px; width:34%; min-width:108px; background:#fff; border:3px solid #1f2544; border-radius:16px; box-shadow:3px 3px 0 #1f2544; padding:4px 6px;
  display:flex; flex-direction:column; align-items:center; cursor:pointer; animation:fall linear forwards; color:#1f2544; z-index:2}
.drop .de{font-size:30px; line-height:1.1} .drop .dt{font-weight:800; font-size:.72em; line-height:1.1; text-align:center}
.drop.caught{background:#8ee0a8; animation-play-state:paused; transform:scale(1.2); transition:transform .2s, opacity .4s; opacity:0}
.drop.nope{background:#ff9dbd; animation-play-state:paused; filter:grayscale(.3); animation:shake .4s}
@keyframes fall{to{top:100%}}
.rend{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; font-family:var(--f-head); font-size:1.4em}
.rend .btn{width:auto; font-size:.8em}

/* ===== Arma el planeta ===== */
.th-planet{background:linear-gradient(#1c2b5a, #3a4f9a 40%, #bfe7ff)}
.th-planet .hud strong{color:#fff}
.th-planet .hint{color:#fff; opacity:1}
.scene{position:relative; height:300px; border:3px solid #1f2544; border-radius:22px; overflow:hidden; box-shadow:4px 4px 0 #1f2544; margin:8px 0 12px}
.scene .sky{position:absolute; inset:0 0 52% 0; background:linear-gradient(#7fcaff,#d8f0ff)}
.scene .land{position:absolute; left:0; right:28%; top:44%; bottom:0; background:linear-gradient(#8fd672,#5fae4a); border-radius:0 60% 0 0 / 0 30% 0 0}
.scene .sea{position:absolute; left:52%; right:0; top:58%; bottom:0; background:linear-gradient(#4fb3ff,#1f78d1); border-radius:40% 0 0 0 / 30% 0 0 0}
.scene .sc{position:absolute; font-size:34px; line-height:1; pointer-events:none}
.scene .sc.big{font-size:70px}
.zone{position:absolute; transform:translate(-50%,-50%); min-width:48px; height:48px; border-radius:999px; border:3px dashed #1f2544; background:rgba(255,255,255,.85);
  display:flex; align-items:center; gap:4px; padding:0 8px; cursor:pointer; font-weight:800; color:#1f2544; z-index:3}
.zone .zn{display:inline-grid; place-items:center; width:28px; height:28px; border-radius:50%; background:#1f2544; color:#fff; font-family:var(--f-head); flex:none}
.zone .zl{font-family:var(--f-head); font-size:.95em; white-space:nowrap}
.zone.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(255,207,63,.7)}}
.zone.set{border-style:solid}
.zone.zA{background:#d6f0ff} .zone.zL{background:#ffe0b8} .zone.zH{background:#cfe0ff} .zone.zB{background:#bff0cf}
.flyin{position:absolute; right:-18px; top:-20px; font-size:30px; animation:popin .4s}
.chips2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.chip2{background:#fff; border:3px solid #1f2544; border-radius:14px; padding:10px 6px; font-family:var(--f-head); font-weight:800; font-size:1.05em; cursor:pointer; box-shadow:3px 3px 0 #1f2544; color:#1f2544}
.chip2.sel{background:var(--sun); transform:scale(1.05)}
.chip2:disabled{opacity:.3; box-shadow:none}

/* ===== Sopa de letras ===== */
.th-soup{background:linear-gradient(#fff6d6,#ffe7b0)}
.wlist{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:10px}
.wlist span{background:#fff; border:2px solid #1f2544; border-radius:999px; padding:2px 10px; font-weight:800; font-size:.8em}
.wlist span.ok{background:#8ee0a8; text-decoration:line-through}
.soup{display:grid; gap:3px; background:#fff; border:3px solid #1f2544; border-radius:16px; padding:6px; box-shadow:4px 4px 0 #1f2544; touch-action:none; user-select:none}
.sc2{aspect-ratio:1; display:grid; place-items:center; font-family:var(--f-head); font-weight:800; font-size:clamp(14px,4.6vw,20px); border-radius:8px; color:#1f2544; cursor:pointer}
.sc2.sel{background:var(--sun)}
.sc2.found{color:#fff}
.sc2.hintc{animation:hintc 1.6s 2}
@keyframes hintc{50%{background:#ff6b9a; color:#fff; transform:scale(1.25)}}

/* ===== Jefe final ===== */
.th-boss{background:linear-gradient(#2a1040,#5b1a6e 50%,#8e2466)}
.th-boss .hud strong{color:#fff}
.th-boss .intro h3{color:#fff}
.th-boss .intro .link{color:#fff}
.arena.rage{animation:rage 1.2s ease-in-out infinite alternate}
@keyframes rage{to{box-shadow:5px 5px 0 #1f2544, inset 0 0 60px rgba(255,60,60,.55)}}
.arena.quake{animation:quake .5s}
@keyframes quake{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(6px,-2px)}}
.bossbox{text-align:center; color:#fff}
.bossname{font-family:var(--f-head); font-weight:800; font-size:1.2em; letter-spacing:.05em}
.bossname .phase{color:#ffcf3f; font-size:.8em}
.hpbar{position:relative; height:22px; border:3px solid #fff; border-radius:99px; background:rgba(0,0,0,.35); overflow:hidden; margin:6px 10px}
.hpbar i{display:block; height:100%; background:linear-gradient(90deg,#ff3b3b,#ff9a4d); transition:width .5s}
.hpbar span{position:absolute; inset:0; display:grid; place-items:center; font-weight:800; font-size:.8em}
.boss{position:relative; display:inline-block; font-size:96px; line-height:1.05; margin-top:4px; animation:float 2.4s ease-in-out infinite}
.boss .smog{position:absolute; font-size:34px; opacity:.8; animation:drift 3s ease-in-out infinite alternate}
.boss .s1{left:-40px; top:20px} .boss .s2{right:-42px; top:40px; animation-delay:-1.5s}
@keyframes float{50%{transform:translateY(-10px)}}
.boss.hurt .bface{display:inline-block; animation:hurt .5s; filter:drop-shadow(0 0 12px #fff)}
@keyframes hurt{20%{transform:translateX(-14px) rotate(-10deg)}40%{transform:translateX(12px) rotate(8deg)}60%{transform:scale(.9)}}
.boss.laugh .bface{display:inline-block; animation:laugh .8s}
@keyframes laugh{25%,75%{transform:scale(1.25) rotate(-6deg)}50%{transform:scale(1.25) rotate(6deg)}}
.boss.poof{animation:poof 1s forwards}
@keyframes poof{30%{transform:scale(1.3) rotate(20deg)}100%{transform:scale(0) rotate(360deg); opacity:0}}
.dmg{position:absolute; left:50%; top:0; font-family:var(--f-head); font-size:.45em; color:#ffcf3f; -webkit-text-stroke:2px #1f2544; animation:plusup .9s forwards; transform:translateX(-50%)}
.taunt{min-height:2.6em; background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.6); border-radius:14px; padding:4px 10px; margin:6px 8px; font-weight:800; font-size:.9em; display:flex; align-items:center; justify-content:center}
.taunt.pop{animation:popin .35s}
.hearts{font-size:28px; letter-spacing:4px}
.hearts .lost{filter:grayscale(1); opacity:.3; display:inline-block; animation:popin .4s reverse}
.bq{margin-top:10px}
.bt{margin:10px 4px}
.bt i{background:linear-gradient(90deg,#ff3b3b,#ffcf3f)}
.bopts{display:grid; gap:10px}
.bopts.g2{grid-template-columns:1fr 1fr}
.bopt{background:#fff; border:3px solid #1f2544; border-radius:16px; box-shadow:4px 4px 0 #1f2544; padding:12px 8px; font-weight:800; font-size:1em; cursor:pointer; color:#1f2544}
.bopt:active{transform:translate(3px,3px); box-shadow:1px 1px 0 #1f2544}
.bopt.right{background:#8ee0a8} .bopt.wrong{background:#ff9dbd}
.bolt{position:absolute; z-index:40; font-size:44px; transform:translate(-50%,-50%); transition:left .42s ease-in, top .42s ease-in, transform .42s; pointer-events:none}
.th-boss .endg{color:#fff}
.medal{display:inline-block; margin-top:10px; background:#ffcf3f; color:#1f2544; border:3px solid #1f2544; border-radius:999px; padding:4px 14px; font-weight:800}

/* ===== Examen final ===== */
.exback{width:auto; justify-self:start; font-size:.95em; padding:6px 16px}
.exam{background:#fffef8; color:#1f2544; border:3px solid #1f2544; border-radius:6px 22px 22px 6px; box-shadow:6px 6px 0 #1f2544; padding:18px 16px 18px 26px; position:relative;
  background-image:repeating-linear-gradient(#fffef8 0 29px, #dfe9f5 29px 30px); background-position:0 6px}
.exam::before{content:""; position:absolute; left:14px; top:0; bottom:0; width:2px; background:#ff9dbd}
.exhead{background:#fff; border:2px solid #1f2544; border-radius:12px; padding:10px 12px; margin-bottom:12px}
.exschool{font-weight:800; font-size:.8em; opacity:.75}

/* ===== Dificultad ===== */
.diffcard{padding:12px 14px}
.diffcard.h{background:linear-gradient(135deg,#fff1e6,#ffe0e0)}
.diffsel{display:grid; grid-template-columns:1fr 1fr; background:var(--soft); border:3px solid var(--line); border-radius:999px; padding:4px; gap:4px}
.diffsel button{border:0; border-radius:999px; padding:10px 6px; font-family:var(--f-head); font-weight:800; font-size:1.1em; cursor:pointer; background:transparent; color:var(--ink)}
.diffsel button[aria-checked="true"][data-d="normal"]{background:#35b862; color:#fff; box-shadow:0 3px 0 #1f2544}
.diffsel button[aria-checked="true"][data-d="dificil"]{background:#e8452c; color:#fff; box-shadow:0 3px 0 #1f2544; animation:bounce .4s}
.diffinfo{margin:10px 2px 6px; font-size:.92em}
.diffstats{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.85em; font-weight:800; color:var(--muted)}
.dbadge{display:inline-block; background:#35b862; color:#fff; border:2px solid #1f2544; border-radius:999px; padding:1px 12px; font-weight:800; font-size:.85em; margin:4px 0}
.dbadge.h{background:#e8452c}
.hmini{font-size:.9em}
.nw.hd{background:#e8452c; transform:rotate(-8deg)}
.hardbtn{background:#e8452c !important}
.arena.hardmode{box-shadow:5px 5px 0 #1f2544, 0 0 0 3px #e8452c}
.lives{display:flex; gap:1px; flex:none; font-size:15px}
.lives i{font-style:normal; transition:transform .3s}
.lives i.off{filter:grayscale(1); opacity:.3; transform:scale(.8)}
.hud{flex-wrap:nowrap}
.hud strong{min-width:0; font-size:.86em; line-height:1.05}
.hud .hbtn{width:36px; height:36px; font-size:16px}
.hud .score,.hud .streak{font-size:.9em; padding:2px 8px}
.tbar,.tbar2,.rt{margin:8px 4px 10px !important; height:14px !important}
.urgent{color:#d6414f; animation:bounce .6s infinite}

/* efectos comunes */
.ring{position:absolute; z-index:35; width:20px; height:20px; margin:-10px 0 0 -10px; border:4px solid #35b862; border-radius:50%; pointer-events:none; animation:ringout .55s ease-out forwards}
@keyframes ringout{to{transform:scale(4.5); opacity:0}}
.plus.gold{color:#ffcf3f; font-size:2.1em}

/* ===== Canasta ===== */
.bins{grid-template-columns:1fr 1fr}
.bin{position:relative; min-height:86px}
.bin b{font-size:.95em}
.bin .bc{position:absolute; top:-10px; right:-8px; min-width:28px; height:28px; border-radius:99px; background:#fff; border:2px solid #1f2544; display:grid; place-items:center; font-family:var(--f-head); font-size:.9em}
.bin.bA{background:#bfe7ff} .bin.bL{background:#ffd9a8} .bin.bH{background:#a9ccff} .bin.bB{background:#b6efc6}
.bin.chomp{animation:chomp .5s}
@keyframes chomp{30%{transform:scale(1.15,.85)}60%{transform:scale(.92,1.1)}}
.bin.shufflein{animation:popin .35s}
.dslot.sway{animation:swayx 1.6s ease-in-out infinite alternate}
@keyframes swayx{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.dcard{animation:popin .35s, floaty 2.4s ease-in-out .35s infinite}
.dcard.drag,.dcard.back,.dcard.fly{animation:none}
@keyframes floaty{50%{translate:0 -6px}}

/* ===== Globos que suben ===== */
.sky2{position:relative; height:360px; overflow:hidden; border-radius:18px; margin-top:10px; background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.35)); touch-action:manipulation}
.bl{position:absolute; top:100%; min-height:98px; border-radius:50% 50% 46% 46% / 56% 56% 44% 44%; border:3px solid #1f2544; display:flex; align-items:center; justify-content:center;
  text-align:center; padding:12px 4px; font-weight:800; font-size:.8em; line-height:1.05; cursor:crosshair; min-width:72px; overflow-wrap:anywhere; color:#1f2544; box-shadow:inset -10px -14px 0 rgba(0,0,0,.08);
  animation-name:rise; animation-timing-function:linear; animation-iteration-count:infinite}
.bl::before{content:""; position:absolute; top:12%; left:18%; width:16%; height:17%; background:rgba(255,255,255,.75); border-radius:50%}
.bl::after{content:""; position:absolute; bottom:-46px; left:50%; width:2px; height:42px; background:#1f2544; opacity:.55}
.bl .knot{position:absolute; bottom:-8px; left:calc(50% - 6px); width:12px; height:9px; background:inherit; border:2px solid #1f2544; border-radius:3px 3px 8px 8px}
.bl.bomb{color:#fff; font-size:1.8em}
.bl.pop{animation:popb .35s forwards !important}
.bl.sad{filter:grayscale(1); opacity:.35; pointer-events:none}
.bl.boom{animation:popb .5s forwards !important; background:#ff9a4d !important}
@keyframes rise{from{top:100%}to{top:-42%}}
.launcher{position:absolute; bottom:4px; left:50%; transform:translateX(-50%); font-size:34px; pointer-events:none; opacity:.8}
.dart{position:absolute; z-index:6; font-size:30px; transform:translate(-50%,-50%); transition:left .25s ease-out, top .25s ease-out, transform .25s; pointer-events:none}

/* ===== Topos ===== */
.hammer{position:absolute; z-index:40; font-size:48px; pointer-events:none; transform-origin:80% 80%; margin:-40px 0 0 -40px; animation:smash .35s ease-in forwards}
@keyframes smash{from{transform:rotate(-70deg)}60%{transform:rotate(20deg)}to{transform:rotate(10deg); opacity:0}}
.mole.gold .m{filter:drop-shadow(0 0 8px #ffcf3f) saturate(2) hue-rotate(-20deg)}
.mole.gold .sign{background:#ffcf3f}
.mole[data-type="bomb"] .sign{background:#3a3a4a; color:#fff}
.mole{touch-action:manipulation}

/* ===== Rayo veloz (deslizar) ===== */
.swipewrap{position:relative; margin-top:6px}
.swhint{position:absolute; top:50%; transform:translateY(-50%); font-weight:800; color:#fff; opacity:.6; text-align:center; font-size:.9em}
.swhint.l{left:-2px} .swhint.r{right:-2px}
.swipe{position:relative; margin:0 30px; touch-action:none; cursor:grab; user-select:none; transition:transform .3s}
.stamp2{position:absolute; top:10px; font-family:var(--f-head); font-weight:800; font-size:1.2em; border:3px solid; border-radius:10px; padding:0 8px; opacity:0; transform:rotate(-12deg)}
.stamp2.yes{left:10px; color:#1f8a47} .stamp2.no{right:10px; color:#d6414f; transform:rotate(12deg)}
.th-speed .tbar2{border-color:#fff}

/* ===== Arma la palabra ===== */
.tile.flying{position:fixed; z-index:80; margin:0; transition:left .2s ease-out, top .2s ease-out, width .2s, height .2s; pointer-events:none}
.tiles.mix .tile{animation:popin .3s}
.wbtns{grid-template-columns:repeat(auto-fit,minmax(0,1fr)) !important}

/* ===== Une las parejas ===== */
.lines .live{stroke:#1f2544; stroke-width:5; stroke-dasharray:8 6; stroke-linecap:round; display:none}
.lines .drawn{stroke-dasharray:400; stroke-dashoffset:400; animation:draw .4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lk{position:relative; touch-action:none}
.lk .dot{position:absolute; top:50%; width:14px; height:14px; margin-top:-7px; border-radius:50%; background:#1f2544; border:2px solid #fff}
.lk.L .dot{right:-9px} .lk.R .dot{left:-9px}
.lk.hot{background:var(--sun) !important; transform:scale(1.05)}

/* ===== Memoria ===== */
.mstat{display:flex; flex-direction:column; gap:2px; font-weight:800; margin-bottom:8px}
.mcard.shake .in{animation:shake .4s}

/* ===== Lluvia ===== */
.drop.swayd{animation-name:fall, dsway; animation-timing-function:linear, ease-in-out; animation-iteration-count:1, infinite; animation-direction:normal, alternate; animation-fill-mode:forwards, none}
@keyframes dsway{from{translate:-18px 0}to{translate:18px 0}}
.drop.bombd{background:#3a3a4a; color:#fff}
.drop{touch-action:manipulation}

/* ===== Planeta ===== */
.chip2{touch-action:none}
.chip2.drag{z-index:20; position:relative; box-shadow:10px 12px 0 rgba(31,37,68,.3)}
.chip2.back{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.chip2.fly{transition:transform .45s ease-in, opacity .45s}
.item-q .bigE{display:block; font-size:44px; line-height:1.1}
.scene .cloud{animation:drift 6s ease-in-out infinite alternate}
.scene .bird{animation:drift 3s ease-in-out infinite alternate}
.scene .fish{animation:drift 2.4s ease-in-out infinite alternate}
.scene .jag{animation:floaty 2s ease-in-out infinite}

/* ===== Jefe final: niebla ===== */
.bopts.fog{filter:blur(7px) grayscale(.6); pointer-events:none; transition:filter .3s}
@media (prefers-reduced-motion: reduce){ .dcard,.dslot.sway,.scene .sc{animation:none} }

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function store(k, v){ try{ v===undefined ? localStorage.removeItem(k) : localStorage.setItem(k, typeof v==="string"?v:JSON.stringify(v)) }catch(e){} }
function read(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function readJSON(k, d){ try{ const v = JSON.parse(read(k)); return v ?? d }catch(e){ return d } }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3500); }
const fold = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const same = (a,b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();

const KEY = "present-perfect-alejandro";
const LANG = "es-CO";
let childName = read("ld5-name") || "Alejandro";
const kid = () => ({ id:"k", name: childName || "campeón", grade:"4" });
const P = s => String(s ?? "").replace(/\{nombre\}/g, kid().name);
let progress = readJSON("ld5-progress", {});
const kp = () => progress;
function record(key, field, value){ const r = progress[key] ||= {}; r[field] = Math.max(r[field]||0, value); store("ld5-progress", progress); }
const D = { palabras: [] };
// ---------- Calificación de 1 a 100 ----------
const nota100 = (ok, total) => Math.max(1, Math.round(100 * ok / total));
const ESCALA100 = "Superior 90–100 · Alto 80–89 · Básico 60–79 · Bajo 1–59";
const nivel100 = n => n >= 90 ? ["Superior","🏆","sup"] : n >= 80 ? ["Alto","🌟","alt"] : n >= 60 ? ["Básico","👍","bas"] : ["Bajo","💪","baj"];

// ---------- Voz ----------
function speak(text, lang){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/_+/g, " … ")); u.lang = lang; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){ toast("Este teléfono no tiene voz disponible."); }
}

// ---------- Sonidos del juego (sin archivos) ----------
let actx = null, muted = read("ld-muted") === "1";
function beep(freqs, dur=.12, type="sine", gap=.09, vol=.16){
  if(muted) return;
  try{
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    const t0 = actx.currentTime;
    freqs.forEach((f,i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i*gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(.001, t+dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02);
    });
  }catch(e){}
}
const SFX = {
  ok:  () => { beep([660, 990], .15, "triangle"); try{ navigator.vibrate && navigator.vibrate(25) }catch(e){} },
  bad: () => { beep([240, 170], .2, "sawtooth", .13, .06); try{ navigator.vibrate && navigator.vibrate([40,30,40]) }catch(e){} },
  pop: () => beep([1200, 500], .06, "square", .03, .08),
  win: () => beep([523, 659, 784, 1046, 1318], .2, "triangle", .1),
  flip:() => beep([520], .05, "sine", 0, .07)
};
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(host, x, y, n=70){
  if(reduceMotion) return;
  const r = host.getBoundingClientRect(), c = document.createElement("canvas"); c.className = "confetti";
  c.width = r.width; c.height = r.height; host.appendChild(c);
  const ctx = c.getContext("2d"), cols = ["#ff6b9a","#ffcf3f","#35b862","#59c3ff","#a77bff","#ff9a4d"];
  const ox = x ?? r.width/2, oy = y ?? r.height*.35;
  const ps = Array.from({length:n}, () => ({ x:ox, y:oy, vx:(Math.random()-.5)*11, vy:-Math.random()*10-3, s:5+Math.random()*6, c:cols[Math.random()*cols.length|0], a:Math.random()*6, va:(Math.random()-.5)*.4 }));
  let f = 0;
  (function tick(){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p => { p.vy += .3; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); ctx.restore(); });
    if(++f < 110) requestAnimationFrame(tick); else c.remove();
  })();
}
const pick = a => a[Math.random()*a.length|0];

// =====================================================================
// Motor de juegos: dificultad, marco, vidas, tiempo, inicio y final
// =====================================================================
const shuffle = a => { const b = [...a]; for(let i=b.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [b[i],b[j]]=[b[j],b[i]]; } return b; };
const PRAISE = ["¡Eso, {n}!","¡Qué crack!","¡Bacano!","¡Súper bien!","¡Lo lograste!","¡Así se hace!","¡Excelente, {n}!","¡Wow! 🤩","¡Imparable!","¡Genial!"];
const OOPS = ["¡Uy, casi! Intenta otra vez.","¡Tú puedes, {n}!","Esa no… ¡prueba otra!"];
const starsFor = r => r >= .9 ? 3 : r >= .6 ? 2 : 1;
const guessLang = (t, lang) => /[¿¡áéíóúñ]|\b(qué|cuál|cómo|es|la|el|los|las|una|un|de|con|por|y)\b/i.test(t) ? "es-CO" : lang;
const readQ = (t, lang) => speak(t, guessLang(t, lang));

// ---------- Dificultad ----------
let DIFF = read("ld1-diff") === "dificil" ? "dificil" : "normal";
const HARD = () => DIFF === "dificil";
const lv = (normal, hard) => HARD() ? hard : normal;
const setDiff = d => { DIFF = d; store("ld1-diff", d); };
const fieldOf = f => f + (HARD() ? "_h" : "");
function level(){ return { read:false }; }

const INFO = {
  bins:{ icon:"🧺", name:"La canasta mágica", how:"Arrastra cada tarjeta con el dedo hasta la canasta de su capa.", hard:"Las canastas cambian de lugar, cada tarjeta tiene tiempo y tienes 3 corazones." },
  balloons:{ icon:"🎈", name:"Revienta el globo", how:"Los globos van subiendo. Lanza el dardo al globo con la respuesta correcta antes de que se escape.", hard:"Suben más rápido y hay globos bomba 💣. ¡No los toques! Tienes 3 corazones." },
  mole:{ icon:"🐹", name:"Atrapa el topo", how:"Los topos salen con respuestas. ¡Martíllalo al que tiene la correcta!", hard:"Salen más rápido, hay topos bomba 💣 y topos dorados 🌟 que dan doble. 3 corazones." },
  speed:{ icon:"⚡", name:"Rayo veloz", how:"Desliza la tarjeta: a la derecha si está bien ✅, a la izquierda si está mal ❌. ¡Antes de que se acabe el rayo!", hard:"Menos tiempo, cada acierto acelera el rayo y tienes 3 corazones." },
  word:{ icon:"🔤", name:"Arma la palabra", how:"Toca las letras en orden para armar la respuesta. La primera letra ya te la damos.", hard:"Hay letras trampa que sobran, tienes tiempo y no hay pistas." },
  link:{ icon:"🔗", name:"Une las parejas", how:"Arrastra el dedo de una tarjeta de la izquierda hasta su pareja de la derecha.", hard:"Más parejas, tiempo límite y 3 corazones." },
  memory:{ icon:"🃏", name:"Memoria", how:"Primero te mostramos las cartas. ¡Memorízalas! Después encuentra cada palabra con su significado.", hard:"8 parejas, sin mirar antes y con tiempo." },
  rain:{ icon:"🌧️", name:"Lluvia de cosas", how:"Van a caer cosas del cielo. Toca SOLO las que pertenecen a la capa que aparece arriba.", hard:"Caen más rápido, hay bombas 💣 y hay que atrapar 7 por ronda. 3 corazones." },
  planet:{ icon:"🗺️", name:"Arma el planeta", how:"Pon cada nombre en su número del dibujo, como en tu libro. Después ubica cada cosa en su capa.", hard:"En la segunda parte solo verás los números, tendrás tiempo y habrá más cosas." },
  soup:{ icon:"🔍", name:"Sopa de letras", how:"Encuentra las palabras. Desliza el dedo desde la primera hasta la última letra.", hard:"Sopa más grande, palabras escritas al revés y 3 minutos." },
  boss:{ icon:"👾", name:"Jefe final: Contaminón", how:"Cada respuesta correcta ataca a Contaminón. Si fallas o se acaba el tiempo, pierdes un corazón. ¡Tienes 3!", hard:"Contaminón tiene más vida, se cura cuando fallas y lanza niebla que tapa las respuestas." }
};
const DECO = { bins:["🌼","🦋","🌷","🐝"], balloons:["☁️","☁️","☁️","🌤️"], mole:["🌼","🍄","🌷","🌻"], speed:["✨","⭐","✨","🌟","⭐"], word:["✏️","📚","🖍️","📏"], link:["🧩","✨","🧩"], memory:["💫","🎀","💫","🌸"], rain:["☁️","☁️","🌤️"], planet:["🛰️","✨","🌙"], soup:["🔍","📖","✏️"], boss:["⚡","✨","🔥","💥"] };

let quickStart = false;
function startGame(A, info, go){
  const run = () => {
    let n = 3; A.stage.innerHTML = `<div class="count tick">3</div>`; beep([520], .1);
    const t = A.every(() => {
      n--; const el = A.stage.querySelector(".count"); if(!el){ clearInterval(t); return; }
      if(n > 0){ el.textContent = n; beep([520], .1); }
      else if(n === 0){ el.textContent = "¡Ya!"; beep([880], .18); }
      else { clearInterval(t); A.say("¡Vamos! " + info.how); go(); return; }
      el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
    }, 600);
  };
  if(quickStart){ quickStart = false; return run(); }
  A.stage.innerHTML = `<div class="intro"><div class="ibig">${info.icon}</div><h3>${info.name}</h3>

  { s:"«Eat» es un verbo regular.", v:false, x:"eat → ate → eaten: es irregular." },
  { s:"«Never» significa «nunca».", v:true, x:"I have never been to Paris." }
];
function tfGen(){
  const r = Math.random();
  if(r < .4){ const v = pick(VERBS), ok = Math.random() < .5, shown = ok ? v.pp : pick(wrongPP(v));
    return { s:`El past participle de «${v.b}» es «${shown}».`, v: okPP(v, shown), x:`${v.b} → ${v.pp}.` }; }
  if(r < .75){ const sj = pick(SUBJ), v = pick(VERBS), ok = Math.random() < .5, h = ok ? sj.h : (sj.h === "have" ? "has" : "have");
    return { s:`«${sj.s} ${h} ${v.pp} ${pick(COMP[v.b])}» está bien escrita.`, v: ok, x:`Con «${sj.s}» va «${sj.h}».` }; }
  const v = pick(VERBS), ok = Math.random() < .5;
  return { s:`«${v.b}» es un verbo ${(ok ? v.r : !v.r) ? "regular" : "irregular"}.`, v: ok, x:`«${v.b} → ${v.pp}» es ${v.r ? "regular" : "irregular"}.` };
}
const tfPool = n => shuffle([...shuffle(TF_BASE).slice(0, Math.ceil(n / 2)), ...Array.from({ length: n }, tfGen)]).slice(0, n);
const tfQ = t => ({ pregunta:`¿Verdadero o falso? ${t.s}`, opciones:["Verdadero","Falso"], correcta: t.v ? 0 : 1, explicacion: t.x });

// ---------- Completar (examen, se escribe) ----------
function fillPool(n){
  const out = [];
  shuffle(CLEAR_IRR).slice(0, 3).forEach(v => out.push({ enunciado:`Past participle de «${v.b}»: ___`, respuesta:[v.pp, v.alt].filter(Boolean).join("|"), why:`${v.b} → ${v.ps} → ${v.pp}` }));
  const r = pick(REG.filter(v => !v.alt)); out.push({ enunciado:`Past participle de «${r.b}»: ___`, respuesta:r.pp, why:"regular: -ed" });
  shuffle(SUBJ).slice(0, 3).forEach(sj => { const v = pick(VERBS); out.push({ enunciado:`${sj.s} ___ ${v.pp} ${pick(COMP[v.b])}. (have / has)`, respuesta:sj.h, why:HH_D[sj.h] }); });
  const sj = pick(SUBJ.filter(x => x.h === "has")), v = pick(VERBS); out.push({ enunciado:`Negativo: ${sj.s} ___ ${v.pp} ${pick(COMP[v.b])}.`, respuesta:"hasn't|has not", why:"" });
  return shuffle(out).slice(0, n);
}

// ---------- Parejas ----------
function linkPairs(n){
  const pool = shuffle([
    ...shuffle(CLEAR_IRR).map(v => ({ l:v.b, r:v.pp })),
    ...EJEMPLOS.slice(0, 4).map(([en, es]) => ({ l:en, r:es }))
  ]);
  const seenL = new Set(), seenR = new Set(), out = [];
  for(const p of pool){ if(seenL.has(p.l) || seenR.has(p.r)) continue; seenL.add(p.l); seenR.add(p.r); out.push(p); if(out.length >= n) break; }
  return out;
}
const memPairs = n => shuffle(CLEAR_IRR).slice(0, n).map(v => ({ palabra:v.b, significado:v.pp }));

// Relaciona del examen
const TIPOS = { R:"Verbo regular", I:"Verbo irregular", H:"Va con has", V:"Va con have" };
function relRows(){
  const r = pick(REG), i = pick(CLEAR_IRR), sh = pick(SUBJ.filter(x => x.h === "has")), sv = pick(SUBJ.filter(x => x.h === "have"));
  return shuffle([{ c:"R", d:`${r.b} → ${r.pp}` }, { c:"I", d:`${i.b} → ${i.pp}` }, { c:"H", d:`${sh.s} ___ eaten.` }, { c:"V", d:`${sv.s} ___ eaten.` }]);
}

// Arrastrar un elemento hasta uno de varios destinos
function dragTo(el, targets, onDrop, onTap){
  let sx = 0, sy = 0, dx = 0, dy = 0, dragging = false, moved = false, over = null;
  const at = (x, y) => targets().find(t => { const r = t.getBoundingClientRect(); return x >= r.left-8 && x <= r.right+8 && y >= r.top-8 && y <= r.bottom+8; });
  el.style.touchAction = "none";
  el.onpointerdown = e => {
    if(e.target.closest(".spk")) return;
    dragging = true; moved = false; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    try{ el.setPointerCapture(e.pointerId) }catch(_){}
    el.classList.add("drag"); el.classList.remove("back");
  };
  el.onpointermove = e => {
    if(!dragging) return; dx = e.clientX - sx; dy = e.clientY - sy; if(Math.abs(dx) + Math.abs(dy) > 8) moved = true;
    el.style.transform = `translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    const t = at(e.clientX, e.clientY); if(t !== over){ over?.classList.remove("hot"); over = t; over?.classList.add("hot"); }
  };
  el.onpointerup = el.onpointercancel = e => {
    if(!dragging) return; dragging = false; el.classList.remove("drag"); over?.classList.remove("hot"); over = null;
    const t = moved ? at(e.clientX, e.clientY) : null;
    if(t) onDrop(t); else { back(); if(!moved && onTap) onTap(); }
  };
  function back(){ el.classList.add("back"); el.style.transform = ""; }
  return { back, flyTo(t){
    const a = el.getBoundingClientRect(), b = t.getBoundingClientRect();
    el.classList.add("fly"); el.style.transform = `translate(${dx + (b.left + b.width/2) - (a.left + a.width/2)}px,${dy + (b.top + b.height/2) - (a.top + a.height/2)}px) scale(.2)`; el.style.opacity = "0";
  } };
}

  const COLORS = ["#ff6b9a","#35b862","#59c3ff","#ff9a4d","#a77bff"];

    const pt = (el, side) => { const w = wrap.getBoundingClientRect(), b = el.getBoundingClientRect(); return [side === "r" ? b.right - w.left : b.left - w.left, b.top - w.top + b.height/2]; };
    function tryMatch(L, R){

        tries[lk] = 1; SFX.bad(); A.oops();
        [L, R].forEach(x => { x.classList.remove("shake", "sel"); void x.offsetWidth; x.classList.add("shake"); });

        if(over || L.classList.contains("ok")) return;

        Ls.forEach(x => x.classList.remove("sel")); L.classList.add("sel"); sel = L; SFX.flip();
        const [x1, y1] = pt(L, "r"); live.setAttribute("x1", x1); live.setAttribute("y1", y1); live.setAttribute("x2", x1); live.setAttribute("y2", y1); live.style.display = "block";

  const again = () => memoryGame(host, onEnd, onBack);
  const A = arena(host, "🃏 Memoria", onBack, "memory");
  const P2 = lv(6, 8), pairs = memPairs(P2);
  const cards = shuffle(pairs.flatMap((w, p) => [{ p, kind:"w", w }, { p, kind:"m", w }]));
  let open = [], found = 0, moves = 0, misses = 0, lock = true, chain = 0;
  function draw(){
    A.stage.innerHTML = `<div class="mstat"><span>🔄 Intentos: <b class="mv">0</b></span>${HARD() ? `<div class="tbar"></div>` : ""}</div>
      <div class="mgrid" style="grid-template-columns:repeat(${lv(3, 4)},1fr)">${cards.map((c, n) => `<button class="mcard" data-n="${n}" aria-label="Carta"><div class="in"><div class="f">❓</div>
      <div class="b">${c.kind === "w" ? `<span class="e">🔤</span><span class="w ind">${esc(c.w.palabra)}</span>` : `<span class="e">⭐</span><span class="w col">${esc(c.w.significado)}</span>`}</div></div></button>`).join("")}</div>`;
    const els = [...A.stage.querySelectorAll(".mcard")];
    A.prog(0, P2);
    let stopT = () => {};
    const go = () => { lock = false; if(HARD()) stopT = A.timer(A.stage.querySelector(".tbar"), 110, () => { lock = true; A.say("¡Se acabó el tiempo!", "bad"); gameOver(A, `Encontraste ${found} de ${P2} parejas.`, again, onBack); }); };
    if(!HARD()){
      A.say("¡Memoriza las cartas! 👀"); els.forEach((el, k) => setTimeout(() => el.classList.add("open"), k * 40));
      A.later(() => { els.forEach(el => el.classList.remove("open")); A.say("¡Ahora encuentra las parejas!"); go(); }, 2600 + cards.length * 40);
    }else{ A.say("¡Sin mirar antes! Encuentra las parejas antes de que se acabe el tiempo."); go(); }
    els.forEach(el => el.onclick = () => {
      const c = cards[el.dataset.n];
      if(lock || el.classList.contains("open")) return;
      el.classList.add("open"); SFX.flip();
      open.push(el); if(open.length < 2) return;
      moves++; A.stage.querySelector(".mv").textContent = moves; lock = true;
      const [a, b] = open.map(x => cards[x.dataset.n]);
      if(a.p === b.p){
        chain++; open.forEach(x => x.classList.add("match")); SFX.ok(); found++; A.score(found); A.prog(found, P2); plus(A, open[1], chain >= 2 ? `¡Doble! 🔥` : "+1");
        A.praise(`«${a.w.palabra}» → «${a.w.significado}»`); speak(`${a.w.palabra}, ${a.w.significado}`, "en-US"); open = []; lock = false;
        if(found === P2){ stopT(); const rightN = Math.max(0, P2 - Math.floor(misses / 2)); A.later(() => finish(A, rightN, P2, again, onBack, onEnd), 900); }
      }else{
        chain = 0; misses++;
        A.say(pick(["¡Esas no son pareja!","¡Uy! Recuerda dónde estaban.","¡Casi! Sigue buscando."]), "bad");
        open.forEach(x => { x.classList.remove("shake"); void x.offsetWidth; x.classList.add("shake"); });
        setTimeout(() => { open.forEach(x => x.classList.remove("open")); open = []; lock = false; }, 900);
      }
    });
  }
  startGame(A, INFO.memory, draw);
}

const SOUP_WORDS = [["HAVE","HAVE"],["HAS","HAS"],["GONE","GONE"],["EATEN","EATEN"],["SEEN","SEEN"],["DONE","DONE"],["WRITTEN","WRITTEN"],["PLAYED","PLAYED"],["NEVER","NEVER"],["TAKEN","TAKEN"],["BEEN","BEEN"],["BROKEN","BROKEN"]];
function buildSoup(words, N, dirs){
  for(let attempt = 0; attempt < 300; attempt++){
    const g = Array.from({ length:N }, () => Array(N).fill("")), placed = [];
    let ok = true;
    for(const [label, w] of [...words].sort((a, b) => b[1].length - a[1].length)){
      let put = false;
      for(let k = 0; k < 200 && !put; k++){
        const [dr, dc] = pick(dirs);
        const rMin = dr < 0 ? w.length - 1 : 0, rMax = dr > 0 ? N - w.length : N - 1, cMin = dc < 0 ? w.length - 1 : 0, cMax = dc > 0 ? N - w.length : N - 1;
        const r0 = rMin + (Math.random() * (rMax - rMin + 1) | 0), c0 = cMin + (Math.random() * (cMax - cMin + 1) | 0);
        let fits = true;
        for(let i = 0; i < w.length; i++){ const ch = g[r0 + dr*i][c0 + dc*i]; if(ch && ch !== w[i]){ fits = false; break; } }
        if(!fits) continue;
        const cells = [];
        for(let i = 0; i < w.length; i++){ g[r0 + dr*i][c0 + dc*i] = w[i]; cells.push((r0 + dr*i) * N + c0 + dc*i); }
        placed.push({ label, w, cells }); put = true;
      }
      if(!put){ ok = false; break; }
    }
    if(!ok) continue;
    const AB = "ABCDEFGHIJLMNOPRSTUVZ";
    for(let r = 0; r < N; r++) for(let c = 0; c < N; c++) if(!g[r][c]) g[r][c] = AB[Math.random() * AB.length | 0];
    return { g, placed };
  }
  return null;
}
function soupGame(host, onEnd, onBack){
  const again = () => soupGame(host, onEnd, onBack);
  const A = arena(host, "🔍 Sopa de letras", onBack, "soup");
  const N = lv(10, 12), dirs = lv([[0,1],[1,0],[1,1]], [[0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,-1],[1,-1],[-1,1]]);
  const words = [...SOUP_WORDS.slice(0, 4), ...shuffle(SOUP_WORDS.slice(4)).slice(0, lv(3, 5))];
  const soup = buildSoup(words, N, dirs);
  let found = 0, right = 0; const hinted = new Set();
  function draw(){
    A.prog(0, soup.placed.length);
    A.stage.innerHTML = `<div class="wlist">${soup.placed.map((p, k) => `<span data-k="${k}">${p.label}</span>`).join("")}</div>${HARD() ? `<div class="tbar"></div>` : ""}
      <div class="soup" style="grid-template-columns:repeat(${N},1fr)">${soup.g.flat().map((ch, i) => `<div class="sc2" data-i="${i}">${ch}</div>`).join("")}</div>
      <div class="wbtns">${HARD() ? "" : `<button class="btn ghost" data-hint>💡 Pista</button>`}<button class="btn ghost" data-read>🔊 Palabras</button></div>`;
    const grid = A.stage.querySelector(".soup"), cells = [...grid.children];
    const stopT = HARD() ? A.timer(A.stage.querySelector(".tbar"), 180, () => { A.say("¡Se acabó el tiempo!", "bad"); finish(A, right, soup.placed.length, again, onBack, onEnd); }) : () => {};
    let start = null, path = [], dragging = false, moved = false;
    const idx = el => el && el.classList && el.classList.contains("sc2") ? Number(el.dataset.i) : null;
    const line = (a, b) => {
      const r1 = a / N | 0, c1 = a % N, r2 = b / N | 0, c2 = b % N, dr = Math.sign(r2 - r1), dc = Math.sign(c2 - c1);
      const len = Math.max(Math.abs(r2 - r1), Math.abs(c2 - c1));
      if(!(r1 === r2 || c1 === c2 || Math.abs(r2 - r1) === Math.abs(c2 - c1))) return [a];
      return Array.from({ length: len + 1 }, (_, i) => (r1 + dr*i) * N + c1 + dc*i);
    };
    const paint = p => { cells.forEach(c => c.classList.remove("sel")); p.forEach(i => cells[i].classList.add("sel")); };
    function tryWord(p){
      const k = soup.placed.findIndex(w => !w.found && (w.cells.join() === p.join() || w.cells.join() === [...p].reverse().join()));
      if(k < 0) return false;
      const w = soup.placed[k]; w.found = true; found++;
      if(!hinted.has(k)) right++;
      A.score(found); A.prog(found, soup.placed.length);
      const col = ["#ff6b9a","#35b862","#59c3ff","#ff9a4d","#a77bff","#e0a800","#2ec4b6","#7b61ff","#d6414f"][k % 9];
      w.cells.forEach((i, n) => setTimeout(() => { cells[i].classList.add("found"); cells[i].style.background = col; beep([600 + n*60], .04, "triangle", 0, .05); }, n * 45));
      A.stage.querySelector(`.wlist [data-k="${k}"]`).classList.add("ok");
      SFX.ok(); plus(A, cells[w.cells[w.cells.length/2 | 0]]); A.praise(`¡${w.label}!`); speak(w.label.toLowerCase(), "en-US");
      if(found === soup.placed.length){ stopT(); A.later(() => finish(A, right, soup.placed.length, again, onBack, onEnd), 1000); }
      return true;
    }
    grid.onpointerdown = e => {
      const i = idx(document.elementFromPoint(e.clientX, e.clientY)); if(i === null) return;
      e.preventDefault();
      if(start !== null && !dragging){ const p = line(start, i); start = null; paint([]); if(p.length > 1 && !tryWord(p)){ SFX.bad(); A.oops(); } return; }
      start = i; path = [i]; dragging = true; moved = false; paint(path);
    };
    grid.onpointermove = e => {
      if(!dragging) return;
      const i = idx(document.elementFromPoint(e.clientX, e.clientY)); if(i === null) return;
      const p = line(start, i); if(p.length > 1) moved = true; path = p; paint(p);
    };
    const up = () => {
      if(!dragging) return; dragging = false;
      if(!moved){ cells[start].classList.add("sel"); A.say("Ahora toca la última letra de la palabra."); return; }
      const p = path; start = null; paint([]);
      if(!tryWord(p)){ SFX.bad(); A.oops(); }
    };
    grid.onpointerup = up; grid.onpointercancel = up; grid.onpointerleave = () => { if(dragging && moved) up(); };
    A.stage.querySelector("[data-hint]")?.addEventListener("click", () => {
      const k = soup.placed.findIndex(w => !w.found); if(k < 0) return;
      hinted.add(k); const c = cells[soup.placed[k].cells[0]];
      c.classList.remove("hintc"); void c.offsetWidth; c.classList.add("hintc");
      A.say(`💡 ${soup.placed[k].label} empieza en la letra que brilla.`);
    });
    A.stage.querySelector("[data-read]").onclick = () => speak(soup.placed.filter(w => !w.found).map(w => w.label.toLowerCase()).join(", "), "en-US");
  }
  startGame(A, INFO.soup, draw);
}

// ---------- 4. ¿Have o has? (afirmativo, negativo y pregunta) ----------
function gradeGame(host, onEnd, onBack){
  const again = () => gradeGame(host, onEnd, onBack);
  const A = arena(host, "🎯 ¿Have o has?", onBack, "grade");
  const N = lv(8, 10);
  const items = Array.from({ length:N }, (_, k) => {
    const sj = pick(SUBJ), v = pick(VERBS), c = pick(COMP[v.b]);
    const kind = HARD() ? ["pos","neg","q"][k % 3] : (k % 4 === 3 ? "neg" : "pos");
    if(kind === "q" && sj.s === "I") return { kind:"pos", sj, v, c };
    return { kind, sj, v, c };
  });
  let i = 0, right = 0;
  function draw(){
    if(i >= items.length) return finish(A, right, items.length, again, onBack, onEnd);
    A.prog(i, items.length);
    const q = items[i]; let first = true, busy = false;
    const { sj, v, c } = q;
    let txt, ok, opts;
    if(q.kind === "pos"){ txt = `${sj.s} ___ ${v.pp} ${c}.`; ok = sj.h; opts = ["have","has"]; }
    if(q.kind === "neg"){ txt = `${sj.s} ___ ${v.pp} ${c}.`; ok = sj.h === "have" ? "haven't" : "hasn't"; opts = ["haven't","hasn't"]; }
    if(q.kind === "q"){ txt = `___ ${lowS(sj.s)} ${v.pp} ${c}?`; ok = cap(sj.h); opts = ["Have","Has"]; }
    const full = txt.replace("___", ok);
    A.stage.innerHTML = `<div class="qpanel">${q.kind === "pos" ? "Completa con <b>have</b> o <b>has</b>" : q.kind === "neg" ? "Completa en <b>negativo</b>" : "Completa la <b>pregunta</b>"}<small>${HARD() ? "" : `${sj.s} → ${sj.h}: ${HH_D[sj.h]}`}</small></div>${HARD() ? `<div class="tbar"></div>` : ""}
      <div class="sentence gsent en">${esc(txt).replace("___", `<span class="blank" id="hhBlank">___</span>`)}</div>
      <div class="hhbtns">${opts.map(o => `<button class="hhb ${/^has/i.test(o) ? "is-has" : "is-have"}" data-o="${o}">${o}</button>`).join("")}</div>
      <button class="btn ghost" data-read>🔊 Escuchar la oración</button>`;

// ---------- 5. El tren de la oración (ordenar palabras) ----------
function articleGame(host, onEnd, onBack){
  const again = () => articleGame(host, onEnd, onBack);
  const A = arena(host, "🚂 El tren de la oración", onBack, "art");
  const N = lv(6, 8);
  const items = Array.from({ length:N }, (_, k) => {
    const sj = pick(SUBJ), v = pick(VERBS), kind = HARD() ? pick(["pos","neg","q"]) : (k % 3 === 2 ? "neg" : "pos");
    const s = sentFor(kind === "q" && sj.s === "I" ? SUBJ[1] : sj, v, kind);
    return { s, words:s.replace(/[.?]$/, "").split(" "), end:s.slice(-1) };
  });
  let i = 0, right = 0;

    if(i >= items.length) return finish(A, right, items.length, again, onBack, onEnd);
    A.prog(i, items.length);
    const it = items[i]; let first = true, busy = false, seq = [];

// ---------- 6. Lluvia de palabras ----------
function rainRounds(){
  return shuffle([
    { label:"⭐ PAST PARTICIPLES", hint:"gone, eaten, seen…", good:() => pick(CLEAR_IRR).pp, bad:() => pick(CLEAR_IRR).ps.split(" / ")[0] },
    { label:"👩 Sujetos con HAS", hint:"he, she, it, my mom…", good:() => pick(SUBJ.filter(s => s.h === "has")).s, bad:() => pick(SUBJ.filter(s => s.h === "have")).s },
    { label:"👥 Sujetos con HAVE", hint:"I, you, we, they…", good:() => pick(SUBJ.filter(s => s.h === "have")).s, bad:() => pick(SUBJ.filter(s => s.h === "has")).s },
    { label:"✅ Participios REGULARES", hint:"terminan en -ed", good:() => pick(REG).pp, bad:() => pick(CLEAR_IRR).pp },
    { label:"🔀 Participios IRREGULARES", hint:"no terminan en -ed", good:() => pick(CLEAR_IRR).pp, bad:() => pick(REG).pp }
  ]).slice(0, 4);
}
function rainGame(host, onEnd, onBack){
  const again = () => rainGame(host, onEnd, onBack);
  const A = arena(host, "🌧️ Lluvia de palabras", onBack, "rain");
  const rounds = rainRounds(), GOAL = lv(5, 7), SECS = lv(30, 26), FALL = lv(6.8, 4.6), EVERY = lv(950, 650);
  let r = 0, caught = 0, wrong = 0;
  const total = rounds.length * GOAL;
  function round(){
    if(r >= rounds.length) return finish(A, Math.max(0, caught - wrong), total, again, onBack, onEnd);
    const R = rounds[r]; let got = 0, over = false;
    A.prog(r, rounds.length);
    A.stage.innerHTML = `<div class="rtarget"><span>Atrapa solo…</span><b>${R.label}</b><span>${R.hint}</span>
      <div class="rgot">${"<i></i>".repeat(GOAL)}</div></div><div class="rt"></div><div class="rainbox"></div>`;
    A.say(`¡Ronda ${r + 1}! Atrapa solo ${R.label.replace(/^\S+\s/, "")}.`);
    const boxEl = A.stage.querySelector(".rainbox");
    const stopT = A.timer(A.stage.querySelector(".rt"), SECS, () => end(false));
    const spawn = () => {
      if(over) return;
      const roll = Math.random(), bomb = HARD() && roll < .12, good = !bomb && roll < .5;
      const txt = bomb ? "💣" : good ? R.good() : R.bad();
      const b = document.createElement("button"); b.className = "drop numdrop" + (bomb ? " bombd" : "") + (HARD() ? " swayd" : "");
      b.innerHTML = `<span class="dt">${esc(txt)}</span>`;
      b.style.left = (4 + Math.random() * 62) + "%"; b.style.animationDuration = (FALL + Math.random() * 1.4) + "s" + (HARD() ? ", 1.2s" : "");
      b.onpointerdown = e => {
        e.preventDefault(); if(b.dataset.done || over) return; b.dataset.done = 1;
        const [x, y] = center(b);
        if(good){
          caught++; got++; A.score(Math.max(0, caught - wrong)); SFX.pop(); setTimeout(SFX.ok, 60); plus(A, b); ring(A, x, y);
          b.classList.add("caught"); A.stage.querySelectorAll(".rgot i")[got - 1]?.classList.add("on");
          if(got >= GOAL) end(true);
        }else{
          wrong++; SFX.bad(); b.classList.add("nope"); ring(A, x, y, "#d6414f");
          A.oops(bomb ? "¡Era una bomba!" : `«${txt}» no es de esta ronda.`);
          if(HARD() && loseCheck(A, again, onBack)){ over = true; stopT(); }
        }
        setTimeout(() => b.remove(), 450);
      };
      b.addEventListener("animationend", ev => { if(ev.animationName === "fall") b.remove(); });
      boxEl.appendChild(b);
    };
    spawn(); A.every(spawn, EVERY);
    function end(win){
      if(over) return; over = true; stopT(); A.stop();
      boxEl.querySelectorAll(".drop").forEach(x => x.remove());
      if(win){ confetti(A.root); SFX.win(); A.praise("¡Ronda completa!"); }
      else A.say(`¡Se acabó el tiempo! Atrapaste ${got} de ${GOAL}.`, "bad");
      boxEl.innerHTML = `<div class="rend"><div style="font-size:64px">${win ? "🎉" : "⏰"}</div><b>${got} de ${GOAL}</b><button class="btn" data-next>${r + 1 < rounds.length ? "Siguiente ronda ▶" : "Ver resultado 🏆"}</button></div>`;
      boxEl.querySelector("[data-next]").onclick = () => { r++; round(); };
    }
  }
  if(HARD()) A.lives(3);
  startGame(A, INFO.rain, round);
}

    else if(el) el.textContent = fmt(secs);
  }, 1000);
  const answeredCount = () => [...exam.querySelectorAll(".exq")].filter(q => {
    if(q.dataset.t === "mc" || q.dataset.t === "tf") return !!q.querySelector("input:checked");

  }).length;
